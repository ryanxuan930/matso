      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserView" }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Username exists, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    patch:
      operationId: updateUser
      security: [{ bearerAuth: [] }]
      description: 更新帳號角色（權限）/ 重設密碼（#32）——限白軍/統裁/管理
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserView" }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteUser
      security: [{ bearerAuth: [] }]
      description: 刪除帳號（#32）——限白軍/統裁/管理；不可刪自己/最後管理員
      responses:
        "204": { description: Deleted }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Conflict, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises:
    get:
      operationId: listExercises
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: >-
        演習清單（WP-B1）。**限白軍/統裁/管理**——演習層是導演工具，作戰方看到的是自己那一局。
      responses:
        "200":
          description: Exercises
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ExerciseView" } }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: createExercise
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: 建立演習（起始階段 PREP，附預設整備 checklist）。限白軍/統裁。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateExerciseRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseView" }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getExercise
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      responses:
        "200":
          description: Exercise
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseView" }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteExercise
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: >-
        刪除演習專案本身。**不動任何 session**——掛在底下的局改回獨立局（`exercise_id` 轉 null）。
        銷毀 session 資料是另一回事（WP-B1b 的銷毀模式）。
      responses:
        "204": { description: Deleted }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/phase:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: advanceExercisePhase
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: >-
        推進階段。**只能沿序前進一階**；該階段所有 `required` 且未勾的 checklist 項目
        會擋下推進（403 EXERCISE_CHECKLIST_INCOMPLETE，`details.missing` 列出鍵）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdvancePhaseRequest" }
      responses:
        "200":
          description: Advanced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseView" }
        "403": { description: Not white cell / checklist incomplete / invalid transition, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/checklist/{item_key}:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
      - name: item_key
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: tickExerciseChecklist
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: 勾稽/取消勾稽一個整備項目（進稽核軌跡）。限白軍/統裁。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChecklistTickRequest" }
      responses:
        "200":
          description: Ticked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseView" }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Exercise or item not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/sessions:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: attachSessionToExercise
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: 把既有的一局掛進本演習（不複製、不新建；已掛在別的演習者拒絕）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttachSessionRequest" }
      responses:
        "200":
          description: Attached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseView" }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Exercise or session not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Session already attached elsewhere, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/sessions/{session_id}:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
      - name: session_id
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: detachSessionFromExercise
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: 把一局從演習卸下（該局變回獨立局；**不刪任何資料**）。
      responses:
        "200":
          description: Detached
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExerciseView" }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/bundle:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getExerciseBundle
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: >-
        撤收建檔（WP-B1）：整場演習的歸檔封包——帳本**原樣**（不做 ADR 007 邏輯截斷，
        故 `verify_chain` 驗得過）+ AAR 統計 + 想定包 + 稽核軌跡，單一 JSON 信封。
        **封包是 ground truth**（不套陣營投影）故限全知；匯出本身也留痕。
      responses:
        "200":
          description: Archive bundle
          content:
            application/json:
              schema:
                type: object
                description: 歸檔封包（`content_hash` 為除自己以外全部內容的 canonical JSON sha256）
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/destroy:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: destroyExerciseData
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: >-
        銷毀模式：硬刪本演習所有 session 的資料（DB 列 + Redis 活狀態）。
        **限 ADMIN**（不是 `is_omniscient`——那包含每一位白軍幕僚）、
        **須已 ARCHIVED**、且 `confirm_name` 逐字相符。
        演習專案與稽核軌跡**留下來**：「這場演習存在過、被誰在何時銷毀」正是稽核要保留的。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DestroyExerciseDataRequest" }
      responses:
        "200":
          description: Destroyed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DestroyResult" }
        "403": { description: Not admin / not archived, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Confirmation name mismatch, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/seal:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getExerciseSeal
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: 簽證狀態（含當前雜湊比對）。未簽證回 null。
      responses:
        "200":
          description: Seal or null
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/SealView" }
                  - { type: "null" }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: sealExerciseParams
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: >-
        參數簽證：快照並鎖住全域參數，同時勾稽 `params_sealed`。
        **是 REHEARSAL 期間的明示動作**，不是進 EXECUTION 的副作用——
        `params_sealed` 同時是離開 REHEARSAL 的必要項，做成副作用會死鎖。
        重複呼叫＝重新快照（參數又調了、要重新確認是正常流程）。
      responses:
        "200":
          description: Sealed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SealView" }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: unsealExerciseParams
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: >-
        解除簽證。**不是繞過閘門，是改變狀態**——會進稽核軌跡。
        沒有它，一場被忘記的演習會讓全域參數永遠唯讀。
      responses:
        "204": { description: Unsealed }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: No seal, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /exercises/{exercise_id}/audit:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getExerciseAudit
      security: [{ bearerAuth: [] }]
      tags: [exercises]
      description: 演習稽核軌跡（階段推進、勾稽、掛載/卸載），時間序。
      responses:
        "200":
          description: Audit trail
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ExerciseAuditEntry" } }
        "403": { description: Not white cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: Not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions:
    get:
      operationId: listSessions
      security: [{ bearerAuth: [] }]
      description: 依角色/參與過濾（director/white/admin 見全部；其餘見自己參與的）
      responses:
        "200":
          description: Role-filtered sessions
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SessionSummary" } }
        "401": { description: Unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: createSession
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSummary" }
        "401": { description: Unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    patch:
      operationId: editSession
      security: [{ bearerAuth: [] }]
      description: 編輯已開推演設定（名稱 / 想定世界初始日期時間）——限統裁/管理（#16）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditSessionRequest" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSummary" }
        "403": { description: Not admin, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    delete:
      operationId: deleteSession
      security: [{ bearerAuth: [] }]
      description: 永久刪除推演（#31，連同單位/事件/標註）——限統裁/管理，前端須二次確認
      responses:
        "204": { description: Deleted }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: archiveSession
      security: [{ bearerAuth: [] }]
      description: 封存推演（#31）——移入歷史頁、活模擬凍結。限統裁/管理
      responses:
        "200": { description: Archived, content: { application/json: { schema: { $ref: "#/components/schemas/SessionSummary" } } } }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/unarchive:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: unarchiveSession
      security: [{ bearerAuth: [] }]
      description: 還原封存推演（#31）——移回進行中。限統裁/管理
      responses:
        "200": { description: Restored, content: { application/json: { schema: { $ref: "#/components/schemas/SessionSummary" } } } }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/clone:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: cloneSession
      security: [{ bearerAuth: [] }]
      description: 複製一局為新推演（沿用單位部署/編裝/地圖標註/參與者/AI 指派；新 RNG 種子）——限統裁/管理
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloneSessionRequest" }
      responses:
        "201":
          description: Cloned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionSummary" }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/ai-status:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getAiStatus
      security: [{ bearerAuth: [] }]
      description: 本局各陣營 AI 決策心跳狀態（思考中／下一次決策倒數）——faction-scoped（一般角色僅見己方）
      responses:
        "200":
          description: AI status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiStatusView" }
        "403": { description: Not a participant, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/state:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getState
      security: [{ bearerAuth: [] }]
      description: >-
        faction-scoped 全量原子快照（重連用，WP-E3）。WS 收到 RESYNC_REQUIRED 後以此端點
        一次取回全部可見狀態並原子重建，取代「多個 GET 各自回來」的非原子拼裝。
        帶 as_faction＝White Cell 視角切換，與 units/intel/map-features 同紀律。
      parameters:
        - name: as_faction
          in: query
          required: false
          schema: { type: string }
          description: White Cell 視角切換——以該陣營視角取快照；一般角色帶他陣營→403
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StateSnapshotView" }
        "403": { description: Not a participant, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/units:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: listUnits
      security: [{ bearerAuth: [] }]
      description: faction-scoped 單位（一般角色見己方；全知見全部；White Cell 可 as_faction 切換視角）
      parameters:
        - name: as_faction
          in: query
          required: false
          schema: { type: string }
          description: White Cell 視角切換——以某陣營視角過濾（O7.4）；非全知者使用→403
      responses:
        "200":
          description: Units
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UnitView" } }
        "403": { description: Not a participant, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /system/config:
    get:
      operationId: getSystemConfig
      security: [{ bearerAuth: [] }]
      description: 全域系統設定（AI/LLM + **推演參數** + 唯讀部署資訊）。限管理/統裁。
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemConfigView" }
        "403": { description: 權限不足, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      operationId: putSystemConfig
      security: [{ bearerAuth: [] }]
      description: >-
        更新可編輯設定。AI/LLM 為**熱更新**（下次使用即生效）；`sim` 推演參數於
        **session runner 啟動時**讀取 → 進行中的推演局不受影響（不會半場改變物理規則），
        新局或該局重跑才套用。移動**預覽**則立即反映（預覽本就是「現在下令會怎樣」）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SystemConfigEdit" }
      responses:
        "200":
          description: Config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemConfigView" }
        "403": { description: 權限不足, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: 參數不合法, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/relations:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getFactionRelations
      security: [{ bearerAuth: [] }]
      description: >-
        **以觀測者為中心**的陣營關係（#91）：回「我對其他各陣營」的關係，供前端決定 2525
        affiliation（友/中/敵）。刻意不回完整矩陣——第三方之間的結盟關係不是觀測者必然知道的事。
        全知未指定 as_faction（全局視角）→ observer 為 null、relations 為空（全局視角不套敵我著色）。
      parameters:
        - name: as_faction
          in: query
          required: false
          schema: { type: string }
          description: White Cell 視角切換——以該陣營為觀測者；一般角色帶他陣營→403
      responses:
        "200":
          description: Relations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FactionRelationsView" }
