# Core REST API v0.1.0 — OpenAPI 3.1 骨架（SPEC_FULL §16.1）
# M0-2 補完全部 schema；platform/ 以 openapi-typescript 由本檔生成型別。
openapi: 3.1.0
info:
  title: MATSO Core API
  version: 0.1.0
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "access token（短效）；由 /auth/login 或 /auth/refresh 取得，置於 Authorization: Bearer 標頭"
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: oid
      in: path
      required: true
      schema: { type: string, format: uuid }
    UnitId:
      name: uid
      in: path
      required: true
      schema: { type: string }
    EquipmentId:
      name: eid
      in: path
      required: true
      schema: { type: string }
    TemplateId:
      name: tid
      in: path
      required: true
      schema: { type: string }
    FeatureId:
      name: fid
      in: path
      required: true
      schema: { type: string }
    ScenarioId:
      name: sid
      in: path
      required: true
      schema: { type: string }
  schemas:
    Error:
      type: object
      description: 統一錯誤格式（app.api.errors 產出）
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: error code 枚舉（O3.1 Order pipeline 部分）
              enum:
                - INTERNAL_ERROR
                - AUTH_INVALID_CREDENTIALS
                - AUTH_INVALID_TOKEN
                - AUTH_TOKEN_EXPIRED
                - AUTH_FORBIDDEN
                - SESSION_NOT_FOUND
                - SCENARIO_NOT_FOUND
                - ORDER_NOT_FOUND
                - ORDER_INVALID_PAYLOAD
                - ORDER_UNIT_NOT_FOUND
                - ORDER_PERMISSION_DENIED
                - ORDER_SEAT_DENIED
                - ORDER_FIRE_APPROVAL_REQUIRED
                - REQUEST_NO_OBSERVER
                - REQUEST_APPROVAL_DENIED
                - REQUEST_ALREADY_DECIDED
                - REQUEST_QUOTA_EXCEEDED
                - ORDER_INVALID_TRANSITION
                - ORDER_UNIT_NO_POSITION
                - ORDER_UNIT_FIXED
                - ORDER_UNREACHABLE
                - ORDER_TARGET_NOT_FOUND
                - ORDER_NO_LOS
                - ORDER_OUT_OF_RANGE
                - ORDER_NO_AMMO
                - ORDER_PRECHECK_FAILED
                - ORDER_ROE_VIOLATION
                - ORDER_NO_STRIKE_ZONE
                - ROLLBACK_TARGET_NOT_FOUND
                - TERRAIN_UNAVAILABLE
                - FACTION_INVALID
                - AI_DISABLED
                - AI_OUTPUT_REJECTED
                - USER_CONFLICT
                - USER_NOT_FOUND
                - EXERCISE_NOT_FOUND
                - EXERCISE_PHASE_INVALID
                - EXERCISE_CHECKLIST_INCOMPLETE
                - EXERCISE_SESSION_CONFLICT
                - EXERCISE_DESTROY_UNCONFIRMED
                - PARAMS_SEALED
            message: { type: string }
            details: { type: object }
    UserRole:
      type: string
      enum: [EXERCISE_DIRECTOR, WHITE_CELL_STAFF, COMMANDER, STAFF, OBSERVER, ANALYST, ADMIN]
    Faction:
      type: string
      description: 想定定義的陣營 id（SPEC §12.1/ADR 006）；WHITE_CELL 為統裁保留字。
      pattern: "^[A-Z][A-Z0-9_]{1,31}$"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, minLength: 1 }
    TokenPair:
      type: object
      description: access（短效）+ refresh（長效）JWT 對
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, description: access token 剩餘秒數 }
    AccessToken:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer }
    CurrentUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
    UserView:
      type: object
      description: 帳號管理列表項（#32）
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        created_at: { type: [string, "null"], description: 建立時間 ISO8601 }
    CreateUserRequest:
      type: object
      description: 建立帳號（#32；白軍/管理設定角色與初始密碼）
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 64 }
        password: { type: string, minLength: 8, maxLength: 128 }
        role: { $ref: "#/components/schemas/UserRole" }
    UpdateUserRequest:
      type: object
      description: 更新帳號角色（權限）或重設密碼（#32；None＝不動）
      properties:
        role: { $ref: "#/components/schemas/UserRole" }
        password: { type: [string, "null"], minLength: 8, maxLength: 128 }
    SessionSummary:
      type: object
      description: lobby 列表項（faction/角色過濾後）
      required: [id, name, mode, status]
      properties:
        id: { type: string }
        name: { type: string }
        scenario_id: { type: [string, "null"] }
        mode: { type: string }
        status: { type: string }
        my_faction: { type: [string, "null"], description: 呼叫者在此 session 的陣營（非參與者為 null） }
        start_time: { type: [string, "null"], description: 開局（session 建立）時間 ISO8601，供 COP 顯示執行時間 }
        world_start_time: { type: [string, "null"], description: 想定世界初始日期時間 ISO8601（#16/#6 日照） }
        archived_at: { type: [string, "null"], description: 封存時間 ISO8601（#31；有值＝已封存） }
        orbat_edit: { type: boolean, default: false, description: 呼叫者是否可編輯本 session 的編裝（白軍全開，或本軍且該局開放自編） }
        allow_fratricide: { type: boolean, default: false, description: "本局是否允許誤傷裁決（WP-C9）。開啟時 COP 才會把友軍列為可選目標，並要求二次確認。" }
        my_unit_scope: { type: array, items: { type: string }, description: 呼叫者限指揮之單位子集（空＝整個陣營；COP 下令面板灰化範圍外） }
        my_seat_role:
          oneOf:
            - { $ref: "#/components/schemas/SeatRole" }
            - { type: "null" }
          description: >-
            呼叫者在此 session 的席位（WP-B5.1/B5.2）。null＝未指派席位（權限沿用角色規則）。
            COP 據此顯示「你坐哪一席」與越權時的說明——後端仍是權威，前端只做提示。
        my_allowed_order_types:
          type: array
          items: { $ref: "#/components/schemas/OrderType" }
          description: >-
            呼叫者的席位可下的令型（後端 SEAT_ORDER_TYPES 投影）。
            ⚠ **空陣列有兩種意思，要配 `my_seat_role` 一起讀**：席位為 null ＝未指派，
            不做席位過濾（權限沿用角色規則）；席位非 null 而清單為空 ＝該席位唯讀
            （情報官、觀察員）。只看陣列會把唯讀席位誤放成全開。
            COP 據此在下令下拉裡停用其餘選項——前端不得自己抄一份席位分工表，那張表會漂開。
            仍只是 UX：越權送出由 ORDER_SEAT_DENIED 擋。
        exercise_id:
          type: [string, "null"]
          description: >-
            所屬演習（WP-B1）。**null＝獨立局**，與掛演習之前的行為完全相同。
            演習物件本身只有白軍/管理看得到；本欄與 `session_role` 是每局資訊，人人可見。
        session_role:
          oneOf:
            - { $ref: "#/components/schemas/SessionRole" }
            - { type: "null" }
          description: 本局在演習中的角色（預推/正式/分析）。null＝未指定（含獨立局）。
    ExercisePhase:
      type: string
      enum: [PREP, REHEARSAL, EXECUTION, REVIEW, ARCHIVED]
      description: >-
        演習階段（WP-B1，對映 [JCATS-A] 的 17 步 SOP）。**只能沿序前進，一次一階**——
        倒退會讓已經簽證的參數（WP-B4）與稽核軌跡失去意義。
    SessionRole:
      type: string
      enum: [REHEARSAL, MAIN, ANALYSIS]
      description: 一局在演習中的角色：預推 / 正式 / 分析。
    ExerciseChecklistItem:
      type: object
      description: >-
        整備勾稽項（WP-B1）。`required: true` 的項目**未勾就推不動階段**——
        checklist 的意義就在於此，只是提示的話與沒有無異。
      required: [key, label, phase, required, done]
      properties:
        key: { type: string, description: 穩定鍵（程式據此自動勾稽，例如 WP-B4 簽證完成即勾 params_sealed） }
        label: { type: string }
        phase:
          $ref: "#/components/schemas/ExercisePhase"
          description: 這一項是「離開哪個階段」的前提
        required: { type: boolean }
        done: { type: boolean }
        done_at: { type: [string, "null"], description: 勾稽時間 ISO8601 }
        done_by: { type: [string, "null"], description: 勾稽者 user id }
    ExerciseSessionRef:
      type: object
      description: 掛在演習底下的一局（摘要）
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, description: ACTIVE / ENDED / ARCHIVED（由 session 導出，與演習階段是**兩條獨立的軸**） }
        session_role:
          oneOf:
            - { $ref: "#/components/schemas/SessionRole" }
            - { type: "null" }
        archived_at: { type: [string, "null"] }
    ExerciseView:
      type: object
      description: >-
        演習專案（WP-B1）。**只有白軍/統裁/管理看得到**——演習層是導演工具；
        作戰方看到的是自己那一局（`SessionSummary.exercise_id` / `session_role`）。
      required: [id, name, phase, created_by, created_at, checklist, sessions]
      properties:
        id: { type: string }
        name: { type: string }
        phase: { $ref: "#/components/schemas/ExercisePhase" }
        created_by: { type: string, description: 建立者 user id }
        created_at: { type: string, description: ISO8601 }
        phase_changed_at: { type: [string, "null"], description: 最近一次階段推進時間 ISO8601 }
        schedule:
          type: object
          description: 行程表（自由結構的鍵值對，例如 d_minus_45 → 想定發佈、d_day → 正式實施）
        checklist:
          type: array
          items: { $ref: "#/components/schemas/ExerciseChecklistItem" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/ExerciseSessionRef" }
    CreateExerciseRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        schedule: { type: object, description: 行程表（可省，預設空） }
    AdvancePhaseRequest:
      type: object
      description: 推進到下一階段。**只接受序列上的下一階**——跳階與倒退皆 EXERCISE_PHASE_INVALID。
      required: [phase]
      properties:
        phase: { $ref: "#/components/schemas/ExercisePhase" }
        note: { type: [string, "null"], description: 推進理由/備註，進稽核軌跡 }
    ChecklistTickRequest:
      type: object
      required: [done]
      properties:
        done: { type: boolean }
    AttachSessionRequest:
      type: object
      description: 把一局掛到演習底下。已掛在**別的**演習底下者拒絕（EXERCISE_SESSION_CONFLICT）。
      required: [session_id]
      properties:
        session_id: { type: string }
        session_role:
          oneOf:
            - { $ref: "#/components/schemas/SessionRole" }
            - { type: "null" }
    DestroyExerciseDataRequest:
      type: object
      description: >-
        銷毀模式（[JCATS-A p.16] 資安要求）。`confirm_name` **必須與演習名稱逐字相符**——
        二次確認若只是「再按一次是」，那不是確認、是多按一次。
      required: [confirm_name]
      properties:
        confirm_name: { type: string }
    DestroyResult:
      type: object
      description: 銷毀結果摘要（同時寫入稽核軌跡）
      required: [sessions_destroyed]
      properties:
        sessions_destroyed: { type: integer }
        rows_deleted:
          type: object
          additionalProperties: { type: integer }
          description: 各表刪除筆數
        redis_keys_deleted: { type: integer, description: 清掉的 Redis 活狀態鍵數 }
    SealView:
      type: object
      description: >-
        參數簽證（WP-B4）。`matches=false` ＝參數在簽證後被動過，該演習的局會**拒起**。
        **鎖住的是全域參數**（EquipmentTemplate 全表 + SimParams + 機動矩陣）——
        那三樣都是全域單例，沒有 session 可以 scope，故簽證生效期間全場唯讀。
      required: [exercise_id, sealed_at, sealed_by, content_hash, current_hash, matches]
      properties:
        exercise_id: { type: string }
        sealed_at: { type: string }
        sealed_by: { type: string }
        content_hash: { type: string, description: 簽證當下的參數雜湊 }
        current_hash: { type: string, description: 此刻的參數雜湊 }
        matches: { type: boolean }
    ExerciseAuditEntry:
      type: object
      description: >-
        演習稽核軌跡（WP-B1）。**刻意不寫 TacticalEventLog**：那是 golden 會驗的雜湊鏈，
        而階段推進是牆鐘的、人為的、局外的事件——寫進鏈裡會擾動決定性重播。
      required: [id, at, actor_id, action]
      properties:
        id: { type: string }
        at: { type: string, description: ISO8601（真實牆鐘；這不是模擬時間） }
        actor_id: { type: string }
        action: { type: string, description: PHASE_ADVANCED / CHECKLIST_TICKED / SESSION_ATTACHED / SESSION_DETACHED / … }
        from_phase:
          oneOf:
            - { $ref: "#/components/schemas/ExercisePhase" }
            - { type: "null" }
        to_phase:
          oneOf:
            - { $ref: "#/components/schemas/ExercisePhase" }
            - { type: "null" }
        detail: { type: object }
    EditSessionRequest:
      type: object
      description: 編輯已開推演設定（#16）——限統裁/管理
      properties:
        name: { type: [string, "null"], minLength: 1 }
        world_start_time: { type: [string, "null"], description: 想定世界初始日期時間 ISO8601（空字串＝清除） }
    CloneSessionRequest:
      type: object
      description: 複製一局為新推演（沿用部署/編裝/參與者/AI 指派，另給新 RNG 種子）
      properties:
        name: { type: [string, "null"], minLength: 1, description: 新局名稱（省略＝來源名 +「（副本）」） }
    AiFactionStatus:
      type: object
      description: 一個陣營的 AI 決策心跳狀態（供 COP「思考中／下一次決策倒數」）
      required: [faction, state]
      properties:
        faction: { type: string }
        state: { type: string, enum: [thinking, idle, offline], description: thinking＝正打 LLM；idle＝等下一次心跳；offline＝worker 未上線/逾時 }
        seconds_until_next: { type: [number, "null"], description: 距下一次決策的秒數（idle 時 >0；thinking/offline 為 null） }
        heartbeat_s: { type: [number, "null"], description: 決策心跳（秒） }
        thinking_since_s: { type: [number, "null"], description: 本次思考已歷時秒數（thinking 時） }
        last_submitted:
          type: [integer, "null"]
          description: >-
            上一個決策週期送出的指令數。⚠ 遙測是**整包覆寫**，thinking 那一則若不帶這個鍵
            就等於把它清成 null——而白軍盯著這一頁的時候 AI 正好在 thinking，
            於是這一格永遠顯示破折號。thinking 與 idle 兩則都要帶。
        total_submitted: { type: [integer, "null"], description: 本局累計送出的指令數（判斷「這個 AI 到底有沒有在動」看這個） }
        cycles: { type: [integer, "null"], description: 累計決策週期數 }
    AiStatusView:
      type: object
      description: 本局各陣營 AI 決策狀態（faction-scoped：一般角色僅見己方；全知見全部）
      required: [factions]
      properties:
        factions: { type: array, items: { $ref: "#/components/schemas/AiFactionStatus" } }
    SupplyLevelView:
      type: object
      description: >-
        單一補給類別的水位（WP-C7.1）。**`capacity` 是編制上限，`on_hand` 是現有量**。
        未編制的類別（`capacity <= 0`）根本不會出現在清單裡——「沒有編制這個類別」與
        「編制了但空了」是完全不同的兩件事，混為一談會讓每個單位看起來都在斷補。
      required: [supply_class, on_hand, capacity, fraction]
      properties:
        supply_class:
          type: string
          enum: [I, III, V, IX]
          description: >-
            北約補給類別編號：I＝口糧/水、III＝油料、V＝彈藥、IX＝維修件。
            ⚠ 與軍械庫 LOGISTICS `capacity` 的鍵（AMMO/FUEL/WATER_FOOD/BATTERY）**不是同一組命名**
            ——那是裝備範本的載運艙格，這裡是單位身上的存量帳。
        on_hand: { type: number, description: 現有量 }
        capacity: { type: number, description: 編制上限（>0；未編制的類別不會出現） }
        fraction:
          type: number
          minimum: 0
          maximum: 1
          description: "`on_hand / capacity`（夾在 0–1）。低於 0.3 即觸發再訂購（WP-C7.2）。"
    UnitView:
      type: object
      required: [id, designation, unit_level, faction, health, comms, supply, starved_days]
      properties:
        id: { type: string }
        designation: { type: string }
        unit_level: { type: string }
        branch: { type: string, description: 兵科（地圖符號的 2525C function ID 來源；UNKNOWN＝通用框） }
        faction: { type: string }
        lat: { type: [number, "null"] }
        lng: { type: [number, "null"] }
        health: { type: number, description: "作戰效能%（由 current/authorized 戰力比經效能曲線導出，真實化交戰）" }
        strength: { type: number, description: "當前戰力（權威量；交戰漸進扣減）" }
        authorized_strength: { type: number, description: "滿編戰力（TO&E 分母）" }
        platform_count: { type: integer, description: "平台/建制數（每次命中僅損一個平台份量）" }
        personnel_current: { type: [integer, "null"], description: "當前人員數（顯示用，可空）" }
        comms: { type: string, description: "通聯狀態 ONLINE/DEGRADED/OFFLINE（活模擬中取自熱狀態，非 DB 播種值）" }
        is_fixed: { type: boolean, description: "固定單位（指揮部等）：不接受 MOVE 令，COP 顯示鎖定標記" }
        readiness:
          type: string
          enum: [OK, DEGRADED, DOWN]
          description: >-
            戰備狀態（由戰力比導出：≥0.90 OK／<0.30 DOWN／其餘 DEGRADED）。
            ⚠ **與 `health` 是兩件事**：`health` 是作戰效能%，而效能曲線在戰力比 ≤0.30 就歸零
            ——於是一個剩三成兵力的連隊 `health` 顯示 0，但它還活著、還會移動、還能被打。
            操作員把 0 讀成「已殲滅」是必然的誤讀，本欄就是為了把那件事說清楚。
            DOWN ＝戰鬥不能（仍存在於戰場上），單位真的被殲滅時不會出現在清單裡。
        suppression:
          type: number
          minimum: 0
          maximum: 1
          description: >-
            壓制度（WP-C1）。0＝無壓制。被命中會累積（砲兵高、直射低），停火後每 tick 衰減
            ——**壓制是可逆的**，那是它與戰損最根本的差別。射擊效能與移動速度都會被它折減。
            **只在友軍（己方＋盟軍）單位上供應**，他方單位一律 0：看得到敵軍被壓制多少
            等於一份免費的即時戰果評估，那正是 WP-C10.4 在擋的東西。白軍 god view 全供應。
        posture:
          type: string
          enum: [MOVING, HASTY, DEFENSE, DUG_IN]
          description: >-
            **已就位**的姿態（WP-C1）。轉換要時間（HASTY 即時／DEFENSE 30 分／DUG_IN 4 小時），
            期間仍算前一級——本欄是「已經到位的那一級」，不是「正在挖的目標」。
            移動會打回 MOVING（挖到一半的洞帶不走）。與 `suppression` 同一個 fog 規則：
            他方單位一律回 MOVING（對方掘壕到什麼程度要靠偵察）。
        supply:
          type: array
          items: { $ref: "#/components/schemas/SupplyLevelView" }
          description: >-
            補給水位（WP-C7）。**空陣列＝這個單位沒有宣告任何補給類別**，不是「全部見底」
            ——既有想定一律如此（`supply` 熱狀態鍵不存在 → 引擎一次計算都不做）。
            依 `SupplyClass` 的宣告順序（I → III → V → IX）排列，順序固定。
            **只在友軍（己方＋盟軍）單位上供應**，他方一律空陣列：敵軍還剩幾天糧、幾成彈
            是後勤情報，看得到就等於一份免費的戰果評估與斷補時機表（同 `suppression` 的
            fog 規則，紅線 3）。白軍 god view 全供應。
        starved_days:
          type: number
          minimum: 0
          description: >-
            斷補天數（模擬日，WP-C7.1）。>0 ＝ Class I（口糧/水）已見底且持續中；
            **只看 Class I**——口糧斷了才是斷補，維修件見底影響的是修復而不是即刻戰力。
            效能倍率隨天數**階梯**下降（1 日 ×0.9／2 日 ×0.75／3 日 ×0.5／5 日 ×0.25），
            補到一次即歸零。同 `supply` 的 fog 規則，他方單位一律 0。
        stale_since_tick:
          type: [integer, "null"]
          description: >-
            **位置凍結**（WP-C5，SPEC_FULL §6.2）。非 null 表示 `lat`/`lng` 不是真實位置，
            而是該單位**最後一次位置回報**的內容，本欄為那次回報的 tick。
            OFFLINE 單位不再回報（位置對己方 COP 凍結）；DEGRADED 降頻回報（位置落後）。
            只出現在**陣營視角**（一般角色，或白軍指定 `as_faction`）；白軍 god view 一律真實位置。
    WeaponView:
      type: object
      description: 單位可用武器（資料驅動 baseStats）——供 ENGAGE 選武器/彈種
      required: [id, template_id, name, category, min_range_m, ammo_types]
      properties:
        id: { type: string }
        template_id: { type: string }
        name: { type: string }
        category: { type: string }
        max_range_m: { type: [number, "null"] }
        min_range_m: { type: number }
        ammo_types: { type: array, items: { type: string } }
        ammo_remaining: { type: [integer, "null"] }
        rounds_per_mission: { type: integer, description: "一次火力任務的準則發數；0＝未宣告，下令面板沿用自己的預設。" }
        indirect_fire: { type: boolean, description: "是否為曲射武器（火力任務只有曲射打得到）。權威為後端的 INDIRECT_CATEGORIES——前端不得再抄一份類別表。" }
    MissionLeg:
      type: object
      required: [phase, from_tick, to_tick, duration_ticks, note]
      properties:
        phase: { $ref: "#/components/schemas/MissionPhase" }
        from_tick: { type: integer }
        to_tick: { type: [integer, "null"], description: "null＝局結束時仍在這個階段（尚未離開）" }
        duration_ticks: { type: [integer, "null"], description: "null＝同上（還沒結束就算不出時長）" }
        note: { type: string }
    MissionTimeline:
      type: object
      required: [order_id, mission_type, unit_id, failed, errors, legs]
      properties:
        order_id: { type: string }
        mission_type: { type: string }
        unit_id: { type: [string, "null"] }
        failed: { type: boolean, description: 任務是否以失敗告終 }
        errors:
          type: integer
          description: 階段評估失敗次數。一道壞任務不該拖垮整局，**但要看得見**。
        legs: { type: array, items: { $ref: "#/components/schemas/MissionLeg" } }
    FactionAI:
      type: object
      description: 一個陣營的 AI 指派。`objectives` 逐條原樣進 AI 提示詞。
      properties:
        mission: { type: string }
        objectives: { type: array, items: { type: object, additionalProperties: true } }
    AutonomyConfig:
      type: object
      description: AI 自主指派設定。**`factions` 是物件不是陣列**（鍵＝陣營代號）。
      properties:
        factions:
          type: object
          additionalProperties: { $ref: "#/components/schemas/FactionAI" }
        heartbeat_s: { type: number, default: 45 }
        ai_ground_truth:
          type: boolean
          default: false
          description: >-
            WP-A1 對照實驗開關：true ＝ AI 改用 ground truth 敵情（全知，迷霧不適用）。
            預設 false（AI 與人一樣受迷霧限制）。
    AutonomySaved:
      allOf:
        - { $ref: "#/components/schemas/AutonomyConfig" }
        - type: object
          properties:
            ok: { type: boolean }
            restarted: { type: boolean, description: 是否已要求 runner 重啟以套用 }
    AutonomyCleared:
      type: object
      properties:
        ok: { type: boolean }
        restarted: { type: boolean }
    OrbatPermissions:
      type: object
      required: [factions]
      properties:
        factions:
          type: array
          items: { type: string }
          description: 開放自編編裝的陣營代號。**空陣列＝只有白軍能編**（預設）。
    RepositionRequest:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    TestLlmRequest:
      type: object
      required: [base_url, model]
      properties:
        base_url: { type: string }
        model: { type: string }
        api_key:
          type: [string, "null"]
          description: 省略＝沿用已存的金鑰（本端點不回寫設定，金鑰僅用於本次測試）。
    TestLlmResult:
      type: object
      required: [ok, detail]
      properties:
        ok: { type: boolean }
        detail: { type: string, description: 成功時為模型回覆摘要；失敗時為可讀的錯誤原因 }
        latency_ms: { type: [integer, "null"] }
    QueuedAck:
      type: object
      additionalProperties: { type: string }
      description: >-
        命令已排入佇列的回執（白軍 MSEL 扣板機/跳過）。**不是「已生效」**——
        API 行程不能直接改 runtime 的記憶（不同行程，熱狀態有 in-process mirror），
        實際套用發生在 runner 的下一個 tick。
    LedgerEntry:
      type: object
      required: [seq, tick, event_type, superseded]
      properties:
        seq: { type: integer, description: 帳本序號（append-only，單調遞增） }
        tick: { type: integer }
        event_type: { type: string }
        initiator_id: { type: [string, "null"] }
        target_id: { type: [string, "null"] }
        damage_calc:
          type: [number, "null"]
          description: 傷亡量。**迷霧型別（面射擊）對非全知者為 null**，與 WS feed 同一條規則。
        ai_decision: { type: object, additionalProperties: true, description: 裁決結構化欄位（已過迷霧投影） }
        detail: { type: object, additionalProperties: true, description: 非證據性診斷欄（不入 hash chain） }
        superseded:
          type: boolean
          description: >-
            是否屬於白軍回滾棄置的世代（WP-E1／ADR 007）。事件不刪（證據保全），
            但它描述的是一條已不存在的時間軸——統計時要排除，稽核時要看得到。
    LedgerPage:
      type: object
      required: [events, next_after_seq, has_more]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
        next_after_seq:
          type: [integer, "null"]
          description: 下一頁的 after_seq（＝本頁最後一筆的 seq）；本頁為空時為 null。
        has_more: { type: boolean, description: 是否還有下一頁 }
    MessageKind:
      type: string
      description: 信文種類（[JCATS-F p.10–14] C2 工件）。REQUEST/APPROVAL 會帶 ref_id 指向申請單。
      enum: [FREE_TEXT, REQUEST, APPROVAL, REPORT]
    RequestKind:
      type: string
      description: 申請單種類（[JCATS-A p.13,15,26]）。
      enum: [AIR_RECON, FIRE_SUPPORT, RESUPPLY_VOUCHER, CALL_FOR_FIRE]
    RequestStatus:
      type: string
      description: >-
        申請單狀態機：PENDING →（核覆）→ APPROVED / DENIED；APPROVED →（用掉）→ EXPENDED。
        EXPENDED 是終態，不可再用——「已核准」與「還沒用掉」是兩件事，合併會讓一張核准單被用兩次。
      enum: [PENDING, APPROVED, DENIED, EXPENDED]
    MessageView:
      type: object
      description: >-
        信文。受眾是**收件席位或陣營**，過濾一律在後端（紅線 3）——
        前端拿到的就是它該看到的，不做二次過濾。
      required: [id, kind, from_seat, body, tick]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/MessageKind" }
        from_seat:
          oneOf: [{ $ref: "#/components/schemas/SeatRole" }, { type: "null" }]
          description: 寄件席位；null＝未指派席位者所發（沿用其角色身分）
        from_username: { type: string }
        to_seat:
          oneOf: [{ $ref: "#/components/schemas/SeatRole" }, { type: "null" }]
          description: 收件席位；null＝發給整個陣營
        to_faction: { type: string, description: 收件陣營 }
        ref_id: { type: [string, "null"], description: 關聯的申請單 id（REQUEST/APPROVAL 用） }
        body: { type: string }
        tick: { type: integer, description: 發送當下的 sim tick }
        read_at: { type: [string, "null"], format: date-time }
    MarkReadRequest:
      type: object
      description: 標示已讀。`message_ids` 省略/null ＝把所有「寄給我且未讀」的信文一次標掉。
      properties:
        message_ids:
          type: [array, "null"]
          items: { type: string }
    MarkReadResult:
      type: object
      description: >-
        **回報實際標到哪幾封**——不是回 204 了事。被跳過的（已讀過、非本人收件、自己寄的）
        不會出現在 `marked` 裡，呼叫端據此知道「我按了但沒生效」，而不是以為成功了卻什麼都沒變。
      required: [marked]
      properties:
        marked:
          type: array
          items: { type: string }
        read_at:
          type: [string, "null"]
          format: date-time
          description: 本次標記使用的時戳（**牆鐘**，不是 sim tick——這是操作員何時看到，不是戰場上第幾分鐘）
    SendMessageRequest:
      type: object
      required: [kind, body]
      properties:
        kind: { $ref: "#/components/schemas/MessageKind" }
        to_seat:
          oneOf: [{ $ref: "#/components/schemas/SeatRole" }, { type: "null" }]
          description: 省略/null＝發給整個陣營
        to_faction: { type: string, description: 省略＝寄件者自己的陣營 }
        ref_id: { type: [string, "null"] }
        body: { type: string, maxLength: 4000 }
    RequestView:
      type: object
      description: 申請單。核覆留痕（誰、第幾 tick）供 AAR 重建事件鏈。
      required: [id, kind, status, params, requested_by, requested_at_tick]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/RequestKind" }
        status: { $ref: "#/components/schemas/RequestStatus" }
        faction: { type: string }
        params: { type: object, additionalProperties: true }
        requested_by: { type: string, description: 申請者 username }
        requested_seat:
          oneOf: [{ $ref: "#/components/schemas/SeatRole" }, { type: "null" }]
        requested_at_tick: { type: integer }
        decided_by: { type: [string, "null"], description: 核覆者 username }
        decided_at_tick: { type: [integer, "null"] }
        decision_note: { type: [string, "null"] }
    FireSchedule:
      type: string
      description: >-
        預劃目標的射擊時機（WP-C10.3）。`AT_TICK`＝到指定 tick 自動下令（攻擊準備射擊）；
        `ON_CALL`＝待命，由 FSO 席位按鈕呼叫。
      enum: [AT_TICK, ON_CALL]
    FirePlanTargetStatus:
      type: string
      description: >-
        `PENDING` 待命／`FIRED` 已下令（order_id 指向該令）／`FAILED` 下令被擋
        （原因見 failure_reason）／`SKIPPED` 計畫取消時未執行。
        **注意 `FIRED` 只代表「令送出去了」**，不代表打中——裁決失敗（無彈/超射程）
        的令會以零毀傷 COMPLETED，那是帳本上的事實，不回頭改這裡的狀態。
      enum: [PENDING, FIRED, FAILED, SKIPPED]
    FirePlanTargetView:
      type: object
      required: [id, seq, target_lat, target_lng, rounds, schedule, status, shooter_unit_id]
      properties:
        id: { type: string }
        seq: { type: integer, description: 計畫內序號（決定執行順序，必須確定） }
        label: { type: string, description: 目標編號/代號（如 AB1001） }
        target_lat: { type: number }
        target_lng: { type: number }
        rounds: { type: integer, minimum: 1, maximum: 200 }
        shooter_unit_id:
          type: string
          description: >-
            執行此目標的砲兵單位。**由計畫指定，系統不自動挑砲**——自動指派
            （「就近可達砲兵」）屬 WP-C10.4 的臨機火力鏈。
        schedule: { $ref: "#/components/schemas/FireSchedule" }
        at_tick: { type: [integer, "null"], description: schedule=AT_TICK 時的執行 tick }
        fire_request_id:
          type: [string, "null"]
          description: >-
            本局要求火協時要掛的已核准 FIRE_SUPPORT 申請單。**一張核准單只兌現一次**，
            故是逐目標欄位而非整份計畫共用。
        status: { $ref: "#/components/schemas/FirePlanTargetStatus" }
        order_id: { type: [string, "null"], description: 已下令時指向產生的 Order }
        fired_at_tick: { type: [integer, "null"] }
        failure_reason: { type: [string, "null"] }
    FirePlanView:
      type: object
      description: 火力計畫（WP-C10.3）。陣營私有——後端依陣營過濾，前端不做過濾。
      required: [id, name, faction, status, created_at_tick, targets]
      properties:
        id: { type: string }
        name: { type: string }
        faction: { type: string }
        status:
          type: string
          enum: [ACTIVE, CANCELLED]
          description: 取消的計畫其未執行目標一律轉 SKIPPED，排程器不再看它。
        created_by: { type: [string, "null"], description: 建立者 username }
        created_at_tick: { type: integer }
        targets: { type: array, items: { $ref: "#/components/schemas/FirePlanTargetView" } }
    CreateFirePlanRequest:
      type: object
      required: [name, targets]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [target_lat, target_lng, shooter_unit_id]
            properties:
              label: { type: string }
              target_lat: { type: number, minimum: -90, maximum: 90 }
              target_lng: { type: number, minimum: -180, maximum: 180 }
              rounds: { type: integer, minimum: 1, maximum: 200, default: 4 }
              shooter_unit_id: { type: string, minLength: 1 }
              schedule: { $ref: "#/components/schemas/FireSchedule" }
              at_tick: { type: [integer, "null"], minimum: 0 }
              fire_request_id: { type: [string, "null"] }
    SubmitRequestRequest:
      type: object
      required: [kind]
      properties:
        kind: { $ref: "#/components/schemas/RequestKind" }
        params: { type: object, additionalProperties: true }
        note: { type: string, maxLength: 2000, description: 隨單附言（會成為一封 REQUEST 信文） }
    DecideRequestRequest:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        note: { type: string, maxLength: 2000 }
    RequestQuota:
      type: object
      description: >-
        該陣營各類申請的配額與已用量。**目前是整局總量，不是每日**——
        SimClock 沒有「模擬日」概念，硬做每日重置會是假的（見 worklog）。
      required: [kind, limit, used]
      properties:
        kind: { $ref: "#/components/schemas/RequestKind" }
        limit: { type: [integer, "null"], description: null＝不限 }
        used: { type: integer }
    SeatRole:
      type: string
      description: >-
        席位（[JCATS-F p.9–10]）——同一陣營內的分工。與 `role`（系統角色）正交：
        role 決定「這個帳號在系統裡是誰」，seat_role 決定「他在這局的參謀席次」。
        **可為 null＝未指派席位**，此時權限完全沿用 role 的既有規則（既有局零行為變更）。
      enum: [COMMANDER, S2_INTEL, S3_OPS, FSO_FIRES, S4_LOG, OBSERVER]
    SessionParticipantView:
      type: object
      description: 推演參與者名冊條目——哪個帳號以哪個陣營/角色參與（決定操控/查看範圍）
      required: [user_id, username, faction, role]
      properties:
        user_id: { type: string }
        username: { type: string }
        faction: { $ref: "#/components/schemas/Faction" }
        role: { $ref: "#/components/schemas/UserRole" }
        seat_role:
          oneOf:
            - { $ref: "#/components/schemas/SeatRole" }
            - { type: "null" }
          description: 席位；null＝未指派（權限沿用 role 既有規則）
        unit_scope: { type: array, items: { type: string }, description: "限指揮之單位 id 子集（空＝整個陣營）" }
    RosterUnit:
      type: object
      description: 名冊 unit_scope 選擇用的單位（供限縮至特定單位）
      required: [id, designation, faction]
      properties:
        id: { type: string }
        designation: { type: string }
        faction: { $ref: "#/components/schemas/Faction" }
    ParticipantRoster:
      type: object
      description: 一局的參與者名冊 + 可指派陣營 + 單位清單（供 unit_scope 選擇）
      required: [participants, factions, units]
      properties:
        participants: { type: array, items: { $ref: "#/components/schemas/SessionParticipantView" } }
        factions: { type: array, items: { type: string }, description: "可指派陣營（本局單位陣營 + WHITE_CELL）" }
        units: { type: array, items: { $ref: "#/components/schemas/RosterUnit" } }
    AssignParticipantRequest:
      type: object
      required: [faction, role]
      properties:
        faction: { $ref: "#/components/schemas/Faction" }
        role: { $ref: "#/components/schemas/UserRole" }
        seat_role:
          oneOf:
            - { $ref: "#/components/schemas/SeatRole" }
            - { type: "null" }
          description: 席位；省略/null＝不指派席位（沿用 role 既有規則）
        unit_scope: { type: array, items: { type: string }, description: "限指揮之單位 id 子集（空/省略＝整個陣營）" }
    EquipmentTemplateView:
      type: object
      description: 裝備範本（武器/感測/通聯…）——編裝編輯器的可配發目錄
      required: [id, name, category, base_stats]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, description: KINETIC / SENSOR / COMMS / LOGISTICS / DRONE }
        base_stats: { type: object, description: 依 weaponeering.schema.json 驗證的屬性 }
    EquipmentInstanceView:
      type: object
      description: 單位持有的裝備實例（含即時狀態與範本屬性，供編裝編輯器）
      required: [id, template_id, name, category, current_state, base_stats]
      properties:
        id: { type: string }
        template_id: { type: string }
        name: { type: string }
        category: { type: string }
        current_state: { type: object, description: "即時狀態（如 {ammo:100}）" }
        base_stats: { type: object }
        quantity: { type: integer, default: 1, description: "建制數量（#30；班內同型武器件數，驅動 squad 齊射）" }
    AddEquipmentRequest:
      type: object
      required: [template_id]
      properties:
        template_id: { type: string }
        quantity: { type: integer, default: 1, description: "配發件數（#30）" }
    EquipmentTemplateEdit:
      type: object
      description: 建立/更新裝備範本（武器屬性/功能）——base_stats 依 weaponeering.schema.json 驗證
      required: [name, category, base_stats]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, description: KINETIC / SENSOR / COMMS / LOGISTICS / DRONE }
        base_stats: { type: object }
    AarReplayStates:
      type: object
      description: >-
        地圖重播的完整資料：`units` 是靜態底本（含 tick 0 基準位置），
        `frames` 只列**有變動的 tick 與有變動的單位**（帳本本身就是這個形狀）。
        前端從基準累加到 scrubTick 即得該時刻全貌。
      required: [units, frames, max_tick]
      properties:
        units: { type: array, items: { $ref: "#/components/schemas/AarReplayUnit" } }
        frames: { type: array, items: { $ref: "#/components/schemas/AarReplayFrame" } }
        max_tick: { type: integer, description: 帳本最後一個事件的 tick }
    AarReplayUnit:
      type: object
      description: 重播底本的單位（靜態屬性 + tick 0 基準狀態）。
      required: [id, faction, base_health]
      properties:
        id: { type: string }
        designation: { type: string }
        faction: { type: string }
        unit_level: { type: string, description: 建制級別（SQUAD/PLATOON/…） }
        is_fixed: { type: boolean }
        authorized_strength:
          type: [number, "null"]
          description: >-
            滿編戰力。聚合交戰的效能% 由「當前戰力 ÷ 此值」導出；
            為 null 時 `strength` 仍會給，但 `health` 無從導出（不猜）。
        base_lat: { type: [number, "null"] }
        base_lng: { type: [number, "null"] }
        base_health: { type: number, description: "tick 0 效能%（帳本無傷即 100）" }
    AarReplayFrame:
      type: object
      description: 一個有事件的 tick，及該 tick 結束時**狀態有變**的單位。
      required: [tick, changes]
      properties:
        tick: { type: integer }
        event_types: { type: array, items: { type: string } }
        changes: { type: array, items: { $ref: "#/components/schemas/AarReplayChange" } }
    AarReplayChange:
      type: object
      description: >-
        單一單位在該 tick 的變動。**只列真的變了的欄位**，未列＝沿用前一狀態。
        `health` 是效能%（0–100）、`strength` 是戰力點——**兩者量綱不同不可互換**
        （這正是本卡修掉的既有錯誤）。
      required: [unit_id]
      properties:
        unit_id: { type: string }
        lat: { type: number }
        lng: { type: number }
        health: { type: number, description: "效能%（0–100）" }
        strength: { type: number, description: 戰力點（人員/平台數量級） }
    AarStats:
      type: object
      description: >-
        AAR 統計指標。**`attempts` 與 `engagements_fired` 刻意分成兩個欄位**：
        「下令交火幾次」與「真的射出去幾次」是兩件事，
        用一個數字承載兩種語意正是 WP-D6.2 那個 bug 的成因。
      required:
        [
          total_events,
          engagements,
          attempts,
          engagements_fired,
          hits,
          hit_rate,
          total_damage,
          guardrail_blocks,
          damage_by_faction,
          event_counts,
          stats_version,
        ]
      properties:
        total_events: { type: integer }
        engagements:
          type: integer
          description: 交戰事件總數（個體＋聚合，含被拒的）
        attempts:
          type: integer
          description: 個體交戰的裁決次數（含 REJECTED）——「下令交火幾次」
        engagements_fired:
          type: integer
          description: >-
            其中真的射出去的次數（`attempts` 扣掉 REJECTED）。**這是命中率的分母**：
            超射程/無彈/無視線/ROE 不准打都是一發未發，不該用來稀釋火力效益。
        hits:
          type: integer
          description: >-
            裁決結果為 HIT 的個體交戰數。判定依 `ai_decision.status`
            （裁決層 `Resolution` 的值域）——齊射與聯合兵種路徑只寫這個鍵。
            ⚠ 齊射/聯合兵種走期望值，其 HIT 的定義是「造成了戰力損失」，
            不是彈著命中；以這兩條路徑為主的局，本欄實質是**有效交戰數**。
        hit_rate: { type: number, description: hits ÷ engagements_fired }
        total_damage: { type: number, description: 全場戰損總量（雙方相加） }
        guardrail_blocks: { type: integer }
        damage_by_faction:
          type: object
          additionalProperties: { type: number }
          description: >-
            各陣營**承受**的總戰損。聚合交戰按 `initiator_loss`/`target_loss` 雙側分別歸帳
            （其 `damage_calc` 是雙方相加，直接用會把攻方傷亡記到守方頭上）；
            面射擊按 `losses_by_unit` 逐單位歸帳。
        event_counts:
          type: object
          additionalProperties: { type: integer }
        stats_version:
          type: integer
          description: >-
            統計口徑版本。v1 的分子只認單發路徑、分母含被拒交戰、聚合戰損雙側都記在守方；
            v2（WP-D6.2）三者皆已修正。**跨版本的數字不可比**——舊封存包沒有這個欄位。
    StateSnapshotView:
      type: object
      description: >-
        重連用的**單一原子快照**（WP-E3；ws_protocol.md 的 RESYNC_REQUIRED 指向此端點）。
        內容＝該觀測者當下看得見的全部狀態：units + contacts + map features + 陣營關係，
        外加 `tick`（sim 時間）與 `last_seq`（傳輸層計數器）。
        **fog of war 過濾一律在後端**（紅線 3）：本端點不自行實作過濾，而是複用
        /units、/intel、/map-features、/relations 的同一份邏輯，故其可見範圍與各端點**逐項相同**。
        `last_seq` 的用途：client 套用快照後，只接受 seq 大於它的 STATE_DIFF——否則
        「RESYNC 送出後、快照回來前」抵達的新 diff 會被隨後回來的舊快照蓋掉。
      required:
        [tick, last_seq, observer_faction, comms_posture, units, contacts, map_features, relations]
      properties:
        tick:
          type: integer
          description: 快照當下的 sim tick（無活模擬的局為 0）
        comms_posture:
          type: [string, "null"]
          description: >-
            觀測陣營的**整體通聯姿態** ONLINE/DEGRADED/OFFLINE（WP-C5）。
            這是敵情粗化的依據本身（後端算一次，前端只用來顯示「敵情圖粗化中」，
            不得據此自行改動資料——粗化已在 `contacts` 上生效）。god view 為 null。
        last_seq:
          type: integer
          description: >-
            快照當下的傳輸層 seq（`session:{id}:broadcast_seq`）。**於讀取狀態之前取樣**——
            反過來的話，介於兩次讀取之間送出的 diff 會既不在快照裡、seq 又 ≤ last_seq，
            被 client 丟棄即成為遺失的更新。
        observer_faction:
          type: [string, "null"]
          description: 本快照的觀測視角（全知且未指定 as_faction 時為 null＝god view）
        units: { type: array, items: { $ref: "#/components/schemas/UnitView" } }
        contacts: { type: array, items: { $ref: "#/components/schemas/ContactView" } }
        map_features: { type: array, items: { $ref: "#/components/schemas/MapFeatureView" } }
        relations: { $ref: "#/components/schemas/FactionRelationsView" }
    SimParamsView:
      type: object
      description: >-
        推演參數（#93）。**未設定時等同原硬編碼常數**，故既有推演局與 golden replay 不受影響。
        改動只在 session runner 啟動時讀取 → 進行中的局不受影響。
      required:
        [foot_xc_kmh, foot_road_kmh, vehicle_fallback_kmh, march_attrition,
         resupply_range_km, intrinsic_optical_range_m, sensor_interval_ticks,
         tick_rate_ms, pace_compression, comms_interval_ticks, ai_heartbeat_s, ai_max_orders,
         checkpoint_interval_ticks, suppression_decay, suppression_fire_penalty,
         suppression_move_penalty, crew_casualty_fraction, dismounted_exposure,
         mine_strike_p_per_km, mine_strike_strength_loss, engineer_mine_strike_mult,
         weather_refresh_ticks, supply_daily_rates, repair_per_day]
      properties:
        foot_xc_kmh: { type: number, description: 徒步越野速度 km/h（預設 5.0） }
        foot_road_kmh: { type: number, description: 徒步沿道路速度 km/h（預設 6.5） }
        vehicle_fallback_kmh: { type: number, description: 無法由編裝導出機動時的後備速度 km/h（預設 40） }
        march_attrition:
          type: object
          additionalProperties: { type: number }
          description: 每公里行軍耗損（戰力點/km），依機動 profile（FOOT/WHEELED/TRACKED）
        resupply_range_km: { type: number, description: 補給撥交距離 km（預設 2.0） }
        intrinsic_optical_range_m: { type: number, description: 無感測裝備時的內建目視距離 m（預設 4000） }
        sensor_interval_ticks: { type: integer, description: 偵測掃描間隔 tick（預設 5） }
        tick_rate_ms: { type: integer, description: 1 tick 的模擬時間 ms（預設 60000＝1 分） }
        pace_compression: { type: number, description: 真實節奏壓縮比（預設 120＝約 0.5s/tick） }
        comms_interval_ticks: { type: integer, description: 通聯狀態重算間隔 tick（預設 5） }
        ai_heartbeat_s: { type: number, description: AI 決策心跳秒數預設（該局 autonomy 設定優先） }
        ai_max_orders: { type: integer, description: 單一 AI worker 累計落單上限（runaway 守衛） }
        checkpoint_interval_ticks:
          type: integer
          description: >-
            狀態快照間隔 tick（WP-E1，預設 600）。以 tick 計而非牆鐘秒——快照點必須是模擬時間上的
            確定位置，牆鐘會隨降頻漂移。預設 600 tick ≈ 5 分鐘牆鐘（@ tick_rate_ms=60000 /
            pace_compression=120，即 0.5s/tick）。崩潰時最多損失一個間隔內的熱狀態。
        suppression_decay:
          type: number
          description: >-
            每 tick 的壓制衰減比（預設 **0.7**）。0.7 表示每分鐘剩七成，約 13 分鐘清乾淨。
            選 0.7 不選 0.85 的理由：後者要 29 分鐘才清得掉，那讓一次砲擊的壓制效果長得像戰損；
            真實的壓制在火力一停就開始鬆動。⚠ 本欄的說明曾寫「預設 0.85」而程式是 0.7，
            照契約算的 client 會全部算錯——權威在 `adjudication/suppression.py` 的常數
            （golden `suppression_defense_60` 也是以 0.7 錄的）。
        suppression_fire_penalty: { type: number, description: 「WP-C1」滿壓制時的射擊效能倍率 }
        suppression_move_penalty: { type: number, description: 「WP-C1」滿壓制時的行軍速度倍率 }
        crew_casualty_fraction: { type: number, description: 「WP-C3」載具毀損時折算的乘員傷亡比 }
        dismounted_exposure: { type: number, description: 「WP-C3」下車人員受彈面（乘車＝1.0 為基準） }
        mine_strike_p_per_km: { type: number, description: 「WP-C2」雷區每公里觸雷機率 }
        mine_strike_strength_loss: { type: number, description: 「WP-C2」觸雷戰損（戰力點） }
        engineer_mine_strike_mult: { type: number, description: 「WP-C2」工兵通過雷區的機率倍率 }
        weather_refresh_ticks:
          type: integer
          description: >-
            「WP-C4b」天氣刷新間隔 tick。**0 ＝永不刷新 ＝整局一份啟動快照**（中性預設，
            既有局位元不變）。要讓天氣隨推演演進就把它設 >0。
        supply_daily_rates:
          type: object
          additionalProperties: { type: number }
          description: >-
            「WP-C7.1」每模擬日消耗率 {類別: 份/日}。**空物件＝全 0 ＝部隊不會憑空開始餓肚子。**
        repair_per_day: { type: number, description: 「WP-C7.3」每模擬日恢復的戰力點（0＝不修復） }
    SystemConfigEdit:
      type: object
      description: 可編輯設定。省略 `sim` ＝ 不動推演參數（只改 AI/LLM）。
      required: [ai_mode, llm_base_url, llm_model]
      properties:
        ai_mode: { type: string, enum: [AI_OFF, AI_BARE, AI_FULL] }
        llm_base_url: { type: string }
        llm_model: { type: string }
        llm_api_key: { type: [string, "null"], description: null＝保留原值；""＝清除 }
        sim: { $ref: "#/components/schemas/SimParamsView" }
    SystemConfigView:
      type: object
      required: [ai, sim, readonly]
      properties:
        ai:
          type: object
          description: AI/LLM 設定（熱更新）
        sim: { $ref: "#/components/schemas/SimParamsView" }
        readonly:
          type: object
          description: 部署層資訊（由容器 env 決定，**需重啟對應服務**才能改；此處僅檢視）
    FactionRelationsView:
      type: object
      description: 以觀測者為中心的陣營關係（#91）。未宣告的配對一律回 HOSTILE（§12.1 預設）。
      required: [observer, relations, factions]
      properties:
        observer:
          type: [string, "null"]
          description: 觀測者陣營；全知的全局視角為 null（無單一觀測者）
        relations:
          type: object
          additionalProperties: { type: string, enum: [ALLIED, NEUTRAL, HOSTILE] }
          description: 「觀測者 → 該陣營」的關係；observer 為 null 時為空物件
        factions:
          type: array
          items: { type: string }
          description: 本局所有陣營 id（供 UI 列舉；不含 WHITE_CELL）
        colors:
          type: object
          additionalProperties: { type: string }
          description: >-
            陣營代表色 {factionId: "#RRGGBB"}（想定 `factions[].color` 的**開局快照**）。
            未宣告 → 空物件，前端沿用預設調色盤。
            ⚠ **不是 fog 敏感資訊**：陣營的名稱與代表色是公開的部隊識別，不是誰在哪裡。
        display_names:
          type: object
          additionalProperties: { type: string }
          description: >-
            陣營顯示名（例：BLUE → 「第 21 砲兵營」）。未宣告 → 空物件，直接顯示 id。
    ContactView:
      type: object
      description: >-
        敵情接觸（fog of war 投影）。**已去識別化**：contact_id 是觀測方自己的紀錄 id，
        不是目標的 ground-truth unit id；designation/echelon/branch/faction 依 fidelity 逐級揭露，
        未達等級為 null。位置為「最後已知」，誤差半徑隨 fidelity 縮小。
        **敵情粗化**（WP-C5，SPEC_FULL §6.2）：觀測陣營整體通聯非 ONLINE 時，`lat`/`lng`
        量化到 h3 res-6 格心（約 3km）、`error_radius_m` 放大到該格尺度、`fidelity` 上限
        DETECTED（連帶 echelon/branch/designation/faction 回到 null）。資料本身不動，只是投影降級。
      required: [contact_id, fidelity, last_seen_tick, lat, lng, error_radius_m]
      properties:
        contact_id: { type: string, description: 觀測方的 IntelContact id（非目標 unit id） }
        fidelity: { type: string, enum: [DETECTED, CLASSIFIED, IDENTIFIED], description: 情報等級 }
        last_seen_tick: { type: integer, description: 最後觀測到的 sim tick }
        lat: { type: number, description: 最後已知緯度 }
        lng: { type: number, description: 最後已知經度 }
        error_radius_m: { type: number, description: 定位誤差半徑（m）；等級愈高愈小 }
        echelon: { type: [string, "null"], description: "CLASSIFIED 以上才揭露的編制層級。**過去這欄叫 unit_type 但裝的是階層**——名實不符會讓「照欄位名接兵種」永遠 miss、「照欄位名接階層」把敵方編成在 CLASSIFIED 就畫上圖。" }
        branch: { type: [string, "null"], description: CLASSIFIED 以上才揭露的兵科（地圖符號的 function ID 來源） }
        designation: { type: [string, "null"], description: IDENTIFIED 才揭露 }
        faction: { type: [string, "null"], description: IDENTIFIED 才揭露敵我 }
    MapFeatureView:
      type: object
      description: 地圖標註/工事（武器據點/障礙/建築/控制措施/補給點；點/線/面）
      required: [id, kind, geometry_type, geometry, owner_faction, attributes]
      properties:
        id: { type: string }
        kind:
          type: string
          description: >-
            OBSTACLE / BUILDING / WEAPON_EMPLACEMENT / CONTROL_MEASURE / TERRAIN / ANNOTATION /
            **SUPPLY_POINT**（WP-C7.2 補給點：帶庫存、可撥交、打得掉；見 `attributes`）。
        geometry_type: { type: string, description: POINT / LINE / POLYGON }
        geometry: { description: GeoJSON coordinates（依 geometry_type） }
        owner_faction: { type: string, description: 擁有陣營（WHITE_CELL＝共同） }
        label: { type: [string, "null"] }
        influence_radius_m: { type: [number, "null"] }
        weapon_template_id: { type: [string, "null"] }
        attributes:
          type: object
          description: >-
            類別相依的自由屬性（Json 欄位，免 migration）。目前有裁決效力的形狀：
            **OBSTACLE**（WP-C2）：`obstacle_type`＝MINEFIELD/WIRE/TANK_DITCH/ABATIS/BRIDGE_DEMO、
            `density`＝0–1；缺 `obstacle_type` ＝純幾何障礙（全中性）。
            **面標註**（WP-A3）：`zone_class`＝NO_STRIKE/RESTRICTED_FIRE；只有 POLYGON 成得了區。
            **SUPPLY_POINT**（WP-C7.2）：`stock`＝`{北約補給類別: 庫存量}`，類別限 I/III/V/IX
            （I 口糧水、III 油料、V 彈藥、IX 維修件），倉庫**無容量上限**；
            `destroyed`＝bool，被火力摧毀後為 true 且**留在圖上**（AAR 要看得到它曾經在那裡）。
            ⚠ 補給點只認 **POINT** 幾何、歸屬必須是某一**作戰陣營**——存成面或掛在 WHITE_CELL
            共同層的補給點，`nearest_usable()` 一個單位都撥交不出去（畫得出來、完全沒有效果），
            故後端在建立/編輯時即擋下。
            **共通**：`color` / `width` / `notes` / `height_m` / `sidc` / `viewshed_ring`（顯示用）。
    MapFeatureCreate:
      type: object
      required: [kind, geometry_type, geometry]
      properties:
        kind: { type: string, description: "見 MapFeatureView.kind（含 SUPPLY_POINT）" }
        geometry_type: { type: string }
        geometry: {}
        owner_faction:
          type: [string, "null"]
          description: >-
            全知可指定（含 WHITE_CELL）；否則本軍。
            ⚠ SUPPLY_POINT **不可**落在 WHITE_CELL 共同層——補給點只撥交給同陣營單位，
            共同層的補給點沒有任何單位拉得到（後端擋，422 `MAP_FEATURE_SUPPLY_POINT_FACTION`）。
        label: { type: [string, "null"] }
        influence_radius_m: { type: [number, "null"] }
        weapon_template_id: { type: [string, "null"] }
        attributes: { type: object, description: "見 MapFeatureView.attributes（含 SUPPLY_POINT 的 stock 形狀）" }
    MapFeatureEdit:
      type: object
      properties:
        kind: { type: [string, "null"] }
        geometry_type: { type: [string, "null"] }
        geometry: {}
        label: { type: [string, "null"] }
        influence_radius_m: { type: [number, "null"] }
        weapon_template_id: { type: [string, "null"] }
        attributes: { type: [object, "null"] }
        owner_faction:
          type: [string, "null"]
          description: >-
            變更歸屬陣營（WHITE_CELL＝共同層，全體可見）。**僅全知可用**——一般角色帶此欄→403，
            以免自己把標註轉給他軍或逕自發布到共同層而繞過 fog。
    TerrainFootprintRequest:
      type: object
      description: 武器射向/雷達扇區的地形裁切請求（#11）
      required: [origin, max_range_m]
      properties:
        origin: { type: array, items: { type: number }, description: "[lng, lat]（射源）" }
        max_range_m: { type: number, exclusiveMinimum: 0 }
        direction_deg: { type: [number, "null"], description: 扇形中心方位（北為 0、順時針）；全圓可省 }
        arc_deg: { type: [number, "null"], description: 張角；null 或 ≥360 → 全圓（雷達） }
        steps: { type: integer, default: 24, description: 方位取樣數（伺服端夾至上限 72） }
        observer_height_m: { type: number, default: 10, description: 射源/雷達離地高 }
        target_height_m: { type: number, default: 2, description: 目標/障礙離地高（default 2m） }
    TerrainFootprintView:
      type: object
      description: 地形裁切後的射界多邊形（GeoJSON 環）
      required: [ring, clipped, max_range_m]
      properties:
        ring: { type: array, items: { type: array, items: { type: number } }, description: "[[lng,lat],…] 閉合環" }
        clipped: { type: boolean, description: 是否有方位受地形限制 }
        max_range_m: { type: number }
    MovementPreviewRequest:
      type: object
      description: 移動路徑預覽請求（#28）——waypoints 優先，否則單一目的地（起點取單位當前座標）
      required: [unit_id]
      properties:
        unit_id: { type: string }
        waypoints: { type: [array, "null"], items: { type: array, items: { type: number } }, description: "[[lng,lat],…] 自訂路徑" }
        to_h3: { type: [string, "null"] }
        to_lat: { type: [number, "null"] }
        to_lng: { type: [number, "null"] }
    MovementCrossing:
      type: object
      description: 路徑穿越一個不可通行標註的紀錄（#28）
      required: [feature_id, kind, entry_frac]
      properties:
        feature_id: { type: string }
        kind: { type: string, description: OBSTACLE/BUILDING/TERRAIN }
        label: { type: [string, "null"] }
        entry_frac: { type: number, description: "0..1 沿全程進入該阻礙的比例" }
    MovementPreviewView:
      type: object
      description: 移動路徑試算結果（#28）
      required: [path, distance_m, duration_ticks, fuel_cost, est_attrition, feasible, forced, crossings]
      properties:
        path: { type: array, items: { type: array, items: { type: number } }, description: "[[lng,lat],…] 含起點" }
        distance_m: { type: number }
        duration_ticks: { type: integer }
        fuel_cost: { type: number }
        est_attrition: { type: number, description: 基礎（確定性）耗損；強穿隨機加成不含在內 }
        feasible: { type: boolean, description: 無強穿＝可行 }
        forced: { type: boolean, description: 是否需強穿至少一個阻礙 }
        crossings: { type: array, items: { $ref: "#/components/schemas/MovementCrossing" } }
        mobility_profile: { type: string, default: FOOT, description: "由編裝導出的機動 profile（#80）：FOOT/WHEELED/TRACKED" }
        speed_kmh: { type: number, default: 0, description: "此單位有效速度（含 tempo 與路徑平均地形調變，#80/#81）" }
        terrain_impassable: { type: boolean, default: false, description: "路徑是否穿越對此 profile 不可通行的地形（#81）" }
        terrain_routed: { type: boolean, default: false, description: "路徑是否為地形 A* 繞路（#82；false＝直線）" }
        fuel_remaining: { type: number, default: 0, description: "單位目前剩餘油量（#84；0＝徒步/無油料模型）" }
        fuel_sufficient: { type: boolean, default: true, description: "現有油量是否足以走完全程（#84；否則中途拋錨）" }
    UnitEdit:
      type: object
      description: |
        單位屬性編輯（PATCH 語義：只送要改的欄位）。

        `faction` 與 `health_status` 不開放：前者改了會讓既有敵情/關係矩陣/迷霧投影
        全部對不上；後者是由戰力比導出的顯示值，裁決層每次命中都會覆寫它——
        送了會回 422 而非靜默忽略。
      properties:
        designation: { type: string, minLength: 1, maxLength: 64, description: 單位番號 }
        branch: { type: string, description: 兵科（決定地圖符號的 2525C function ID） }
        unit_level: { type: string, description: "編制級別。改它需重啟該局 runner 才會影響聚合裁決（見 restart_required）" }
        personnel_current: { type: integer, minimum: 0, maximum: 100000, description: 現員人數（未明示 attributes.platform_count 時即為建制數） }
        authorized_strength: { type: number, exclusiveMinimum: 0, description: 滿編戰力（戰力比的分母） }
        current_strength: { type: number, minimum: 0, description: 當前戰力（裁決的權威量；改它會連帶重算作戰效能） }
        attributes: { type: object, description: 自由欄位（platform_count 寫在此處會覆蓋人數導出） }
        health_status: { type: number, minimum: 0, maximum: 100, description: "**不可編輯**（導出量）。送此欄一律 422。" }
    UnitEditView:
      type: object
      required: [id, designation, branch, faction, unit_level, health, strength, authorized_strength, platform_count, attributes]
      properties:
        id: { type: string }
        designation: { type: string }
        branch: { type: string }
        faction: { type: string }
        unit_level: { type: string }
        health: { type: number, description: 作戰效能%（由戰力比導出） }
        strength: { type: number, description: 當前戰力 }
        authorized_strength: { type: number, description: 滿編戰力 }
        personnel_current: { type: [integer, "null"] }
        platform_count: { type: integer, description: 實際生效的建制數（明示 attributes → 人數 → 依級別導出） }
        attributes: { type: object }
        restart_required: { type: boolean, default: false, description: 本次編輯是否有需重啟 runner 才生效的項目（unit_level） }
    ScenarioBundle:
      type: object
      required: [scenario]
      description: |
        想定包。各鍵對應 `scenarios/examples/<name>/` 目錄下的一個檔案／子目錄。
        **新增鍵時載入器（`core/app/scenario/loader.py`）要同步讀，否則就是靜默丟資料。**
      properties:
        scenario: { type: object, description: "scenario.yaml（見 contracts/scenario.schema.json）" }
        orbat: { type: object, description: "{faction: orbat.yaml 內容}（見 contracts/orbat.schema.json）" }
        msel: { type: [object, "null"], description: "msel.yaml（狀況腳本）" }
        roe: { type: [object, "null"], description: "roe.yaml（各陣營交戰規則：預設火力政策與禁用武器）" }
        overrides:
          type: [object, "null"]
          description: "overrides/ 目錄；目前只有 mobility_matrix（想定級機動覆寫）"
          properties:
            mobility_matrix: { type: object }
    ScenarioSaved:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string }
        name: { type: string }
        version: { type: string }
    EquipmentStateEdit:
      type: object
      required: [current_state]
      properties:
        current_state: { type: object, description: "覆寫此實例的即時狀態（如 {ammo:60}）" }
        quantity: { type: [integer, "null"], description: "調整建制數量（#30；null＝不動）" }
    CreateSessionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        scenario_id: { type: [string, "null"] }
        mode: { type: string, enum: [REALTIME, WEGO, IGO_UGO], default: REALTIME }
    InjectRequest:
      type: object
      required: [event_type]
      properties:
        event_type: { type: string, minLength: 1 }
        payload: { type: object }
        faction: { type: [string, "null"], description: 受眾陣營（null＝廣播） }
    InjectResponse:
      type: object
      required: [seq]
      properties:
        seq: { type: integer }
    ControlRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [PAUSE, RESUME, ROLLBACK] }
        target_tick:
          type: [integer, "null"]
          description: >-
            ROLLBACK 目標 tick——必須是既有快照的 tick（見 GET /sessions/{id}/checkpoints）。
            回滾為非同步：端點驗證目標並排入請求 + 暫停該局，實際還原由重建後的 runner
            在啟動階段執行（≤ 掃描間隔，約 3 秒）。回滾後該局維持暫停，需自行 RESUME。
    ControlResponse:
      type: object
      required: [seq]
      properties:
        seq: { type: integer }
        rollback_requested_tick:
          type: [integer, "null"]
          description: ROLLBACK 時回傳已受理的目標 tick（其餘動作為 null）
    CheckpointView:
      type: object
      description: 一個可回滾的狀態快照點（WP-E1）。
      required: [tick, ledger_seq, state_hash, created_at]
      properties:
        tick: { type: integer, description: 快照代表「此 tick 跑完後」的狀態 }
        ledger_seq: { type: integer, description: 快照當下的帳本鏈尾 seq（時間軸身分） }
        state_hash: { type: string }
        created_at: { type: string, format: date-time }
    OrderType:
      type: string
      enum: [MOVE, ENGAGE, RECON, RESUPPLY, POSTURE, FIRE_MISSION, MISSION, FORMATION, ENGINEER]
    OrderStatus:
      type: string
      enum: [PENDING, VALIDATED, EXECUTING, COMPLETED, REJECTED, CANCELLED]
    Formation:
      type: string
      description: >-
        隊形（WP-C3，[JCATS-A p.7,26]）。三個係數：行軍速度、面殺傷暴露、火力正面。
        **COLUMN 是中性預設**（三個係數皆 1.0）——它是「沒有特別展開」而不是「最好的隊形」；
        把 LINE 當中性值會讓既有局憑空獲得火力加成。
      enum:
        - COLUMN      # 縱隊：行軍快、正面窄、挨砲慘
        - LINE        # 橫隊：火力全開、機動慢
        - WEDGE       # 楔形：攻擊隊形
        - VEE         # V 形：預期正面接敵
        - HERRINGBONE # 魚骨：行軍暫停時的環形警戒
    MissionType:
      type: string
      description: >-
        任務型（WP-A2，[IST160 p.4–5]）。**下的是任務，不是動作**——
        展開成低階令（MOVE/ENGAGE/…）的是確定性的符號層分解器，不是 LLM。
        LLM 只負責選任務型與參數，那正是 Neuro-Symbolic 的分工。
      enum:
        - SEIZE      # 奪佔：沿 axis 機動 → 對目標區內敵接戰 → 佔領後轉守
        - DEFEND     # 防守：就位 → 設 DEFENSE 姿態 → 對進入射界之敵接戰
        - SCREEN     # 掩護幕：沿線佔位 → 偵測回報但不接戰 → 受壓後退
        - MOVE_MARCH # 行軍序列：按序出發、維持間距
    MissionPhase:
      type: string
      description: >-
        任務階段（WP-A2）。**一套階段涵蓋四種任務型**——各任務型只是走過其中不同的子集。
        另立四套階段機會讓 AAR 的任務時間軸沒有共同語彙。
      enum:
        - PLANNED       # 已受理、尚未分解（下一個 tick 才展開）
        - MOVING        # 機動中
        - ENGAGING      # 接敵中
        - CONSOLIDATING # 鞏固中（佔領後整理／構工中）
        - HOLDING       # 穩定狀態（守備／掩護幕在位）
        - COMPLETE
        - FAILED        # 被殲/彈盡/目標不可達——單位轉 HOLD
    MissionPayload:
      type: object
      description: >-
        MISSION 令載荷。`params` 的形狀依 `mission_type` 而異——
        逐型的必要欄位由後端 `orders/mission.py` 的 typed model 驗證，
        不合法的參數在 submit 就被擋下（不是等到分解時才失敗）。
      required: [mission_type, params]
      properties:
        mission_type: { $ref: "#/components/schemas/MissionType" }
        params:
          type: object
          additionalProperties: true
          description: >-
            SEIZE={objective:{lat,lng}, axis?:[{lat,lng}], objective_radius_m?}；
            DEFEND={area:{lat,lng}, area_radius_m?, orientation_deg?}
            ——⚠ 半徑是**頂層** `area_radius_m`，不是巢狀的 `area.radius_m`：
            `LatLng` 只有 lat/lng 且 pydantic 預設忽略多餘欄位，寫錯位置會被靜默丟棄、防區永遠 500 m；
            `orientation_deg`＝防禦正面方位（度，正北 0）——**只對正面 ±90 度內的敵接戰**，
            未宣告＝全向（既有行為）。
            SCREEN={line:[{lat,lng}]}——受壓（壓制 ≥0.5）時**背離最近的已知敵後退 1200 m**，
            兩次後退至少間隔 10 tick。
            MOVE_MARCH={route:[{lat,lng}], spacing_km?}——`spacing_km` 展開行軍縱隊：
            縱隊長度＝間隔 ×（平台數 − 1），受彈面取其半徑，故拉開間隔＝降低單發砲彈的覆蓋率。
    OrderRequest:
      type: object
      required: [unit_id, order_type]
      properties:
        unit_id: { type: string, minLength: 1 }
        order_type: { $ref: "#/components/schemas/OrderType" }
        payload:
          type: object
          additionalProperties: true
          description: "依 order_type 而異：MOVE={to_h3,mobility_profile,to_lat?,to_lng?,tempo?}（to_lat/to_lng＝精確移動，跳過六角格心吸附；`tempo`＝NORMAL｜FORCED_MARCH，強行軍以行軍耗損換速度，省略＝NORMAL）；ENGAGE={target_unit_id,weapon_id?,ammo_type?,fire_policy?}。指定 weapon_id＝僅該武器射擊；未指定＝以武器組合聯合兵種加總（SPEC_EXTEND），fire_policy 精修（見 FirePolicy）。FIRE_MISSION={target_lat,target_lng,rounds?,weapon_id?,ammo_type?,fire_request_id?}＝面目標射擊（`ammo_type=SMOKE`＝發煙任務，WP-C4c：落點生成煙幕、**不產生傷亡**，發數決定持續時間；煙幕是雙面的，放煙方同樣看不穿）（打座標而非打單位，WP-C10.2）：落彈依武器 CEP 散布，殺傷半徑內**敵我單位一律受影響**；本局要求火協時須附已核准的 FIRE_SUPPORT 申請單。MISSION={mission_type,params}＝任務級下令（WP-A2）：由確定性分解器展開成低階令，見 MissionPayload。FORMATION={formation?,mounted?,column_spacing_km?}＝乘駐車與隊形（WP-C3）：三者至少指定一項，未指定的欄位維持原狀（只想下車的令不該把隊形一起重設）。`column_spacing_km`＝行軍間隔（km），換算成受彈面 `footprint_m`（縱隊長度的一半），拉開間隔＝降低單發砲彈能罩到的平台數。ENGINEER={action,feature_id?,obstacle_type?,lat?,lng?,radius_m?}＝障礙作業（WP-C2）：action=BREACH 需 feature_id（破既有障礙）；action=EMPLACE 需 obstacle_type+lat/lng（設新障礙）。**須工兵單位**（ORBAT attributes.unit_kind=ENGINEER）且距作業點 500 m 內；破障/設障各有工時（雷區 45 tick、斷橋 120 tick），完工才改地圖標註。"
        acknowledge_restricted:
          type: boolean
          description: "WP-A3（省略＝false）：下令者明確確認『目標位於限制射擊區（RESTRICTED_FIRE）仍要射擊』。僅對 RESTRICTED_FIRE 有效——NO_STRIKE 不可 override。為 true 且確實落在限制射擊區時，伺服端寫一筆 ORDER_RESTRICTED_FIRE_OVERRIDE 至 Ledger 供 AAR 追究。"
    FirePolicy:
      type: string
      description: "聯合兵種火力政策（SPEC_EXTEND P3；ENGAGE payload.fire_policy，未指定＝FREE）。僅意圖/篩選，不改物理數值。指定 payload.weapon_id 等同僅該武器射擊（單武器）。"
      default: FREE
      enum:
        - FREE              # 自由開火：所有在射程/有彈/可達的武器一起打
        - SMALL_ARMS_ONLY   # 僅輕兵器（節約重火力/保持隱蔽）；反裝甲/飛彈類保留
        - ANTI_ARMOR_HOLD   # 反裝甲/飛彈類僅在對此目標有效（pk>0）時才用，勿浪費在步兵
    PrecheckCheck:
      type: object
      required: [name, passed]
      properties:
        name: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    PrecheckResult:
      type: object
      required: [feasible, checks]
      properties:
        feasible: { type: boolean }
        checks: { type: array, items: { $ref: "#/components/schemas/PrecheckCheck" } }
        reason: { type: [string, "null"] }
    OrderResponse:
      type: object
      required: [id, unit_id, order_type, status, issued_at_tick]
      properties:
        id: { type: string }
        unit_id: { type: string }
        order_type: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        precheck:
          oneOf:
            - $ref: "#/components/schemas/PrecheckResult"
            - type: "null"
        issued_at_tick: { type: integer }
        resolved_at_tick: { type: [integer, "null"] }
        target_unit_id: { type: [string, "null"], description: ENGAGE 目標單位 }
        target_h3: { type: [string, "null"], description: MOVE 目的地 hex }
        issuer_id:
          type: [string, "null"]
          description: >-
            下令者的使用者 id。**行動後檢討要追究「這道逆襲令是作戰官還是指揮官下的」，
            靠的就是這一欄**——Order 表一直存著 issuerId，但過去沒有任何讀取端回它，
            於是四席位演習的分工在 AAR 上完全不可評量。
        payload:
          type: [object, "null"]
          description: >-
            下令當時的原始載荷。**FIRE_MISSION 打的是座標**，
            target_unit_id / target_h3 兩欄皆為 null——不回 payload 的話，
            一筆「有人想砲擊醫院」的 REJECTED 紀錄說得出是誰，卻說不出打哪裡。
        parent_order_id:
          type: [string, "null"]
          description: >-
            分解自哪一道 MISSION 令（WP-A2）。null＝直接下的令。
            取消母令會連帶取消所有**尚未終結**的子令——已執行的不追溯（那是既成事實）。
        mission_type:
          oneOf:
            - { $ref: "#/components/schemas/MissionType" }
            - { type: "null" }
          description: 僅 MISSION 令有值
        mission_phase:
          oneOf:
            - { $ref: "#/components/schemas/MissionPhase" }
            - { type: "null" }
          description: 僅 MISSION 令有值；每 tick 由 `mission_runtime` 評估
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: JWT pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/refresh:
    post:
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 新的 token 對（滑動續期：access + 新 refresh）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "401": { description: Invalid or expired refresh token, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /auth/logout:
    post:
      operationId: logout
      security: [{ bearerAuth: [] }]
      description: 登出並**撤銷該 refresh token**（WP-E2）。在此之前本端點是 no-op（「用戶端丟棄 token 即登出」），於是撿到 refresh token 的人照樣能一直換發新的 access。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses: { "204": { description: Logged out } }
  /auth/me:
    get:
      operationId: currentUser
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUser" }
        "401": { description: Unauthenticated, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /users:
    get:
      operationId: listUsers
      security: [{ bearerAuth: [] }]
      description: 帳號列表（#32）——限白軍/統裁/管理
      responses:
        "200":
          description: All accounts
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/UserView" } }
        "403": { description: Not permitted, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: createUser
      security: [{ bearerAuth: [] }]
