        "404": { description: Session not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: Validation or physics precheck failed, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: Terrain plugin unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/orders/{oid}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { $ref: "#/components/parameters/OrderId" }
    delete:
      operationId: cancelOrder
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
        "404": { description: Order not found, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: Order not cancellable (illegal transition), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/ledger:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: queryLedger
      security: [{ bearerAuth: [] }]
      description: >-
        帳本查詢（事後爭議裁決）。**與 AAR 走同一套迷霧投影**（`aar/fog.project_events`）
        與同一套存取規則：參與者只看得到自己陣營看得到的事件，全知/ANALYST 不受限。
        與 AAR 的差別在於**回滾棄置的世代也回**（`superseded=true` 標示）——
        AAR 是敘事、要一條連貫的時間軸；這裡是稽核、要完整證據。
      parameters:
        - { name: after_seq, in: query, required: false, schema: { type: integer, minimum: 0 }, description: 只回 seq 大於此值者（分頁游標；帳本 append-only 所以 seq 單調） }
        - { name: types, in: query, required: false, schema: { type: string }, description: "逗號分隔的 event_type 白名單；省略＝全部" }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }, description: 單頁筆數上限 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerPage" }
  /sessions/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: listMessages
      description: >-
        本人可見的信文（WP-B5.2）——寄給自己席位、自己陣營、或自己寄出的。
        **受眾過濾在後端**（紅線 3）；全知角色可見全部。
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MessageView" } }
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessageRequest" }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageView" }
        "403": { description: 非本局參與者 }
  /sessions/{id}/messages/read:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    post:
      operationId: markMessagesRead
      description: >-
        把指定（或全部）寄給本人的信文標為已讀。
        **在此之前 `Message.readAt` 沒有任何寫入端**——欄位在 DB、在契約，就是沒有人寫得進去，
        所以「已讀」這件事在系統裡從來沒有發生過，寄件者看不出下級收到沒有。
        三條規則：①**首次已讀為準**（已有時戳不覆寫——AAR 要問的是第一次被看到是什麼時候）；
        ②**寄件備份不算已讀**（否則每封信送出即已讀）；
        ③**必須是真收件方**（不吃全知旁通——統裁看得到全場，但他看過不等於下級看過）。
        ⚠ 已知限制：`readAt` 是每封信一格、不是每人一格，發給整個陣營的信只要有一位參謀
        標了已讀，全陣營就都算已讀。逐人已讀需要新的關聯表。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkReadRequest" }
      responses:
        "200":
          description: 實際標到的信文
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkReadResult" }
        "403": { description: 非本局參與者 }
  /sessions/{id}/requests:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: listRequests
      description: 本陣營的申請單（全知角色可見全部）+ 配額用量。
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [requests, quotas]
                properties:
                  requests: { type: array, items: { $ref: "#/components/schemas/RequestView" } }
                  quotas: { type: array, items: { $ref: "#/components/schemas/RequestQuota" } }
    post:
      operationId: submitRequest
      description: 送出申請單（下級席位）。配額用罄→自動 DENIED（不是拒收，留痕才看得出被卡在哪）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitRequestRequest" }
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestView" }
  /sessions/{id}/requests/{rid}/decide:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { name: rid, in: path, required: true, schema: { type: string } }
    post:
      operationId: decideRequest
      description: 核覆申請單（上級/白軍席位）。越權→ REQUEST_APPROVAL_DENIED。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DecideRequestRequest" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequestView" }
        "403": { description: 此席位無核覆權 }
        "409": { description: 該申請單已非 PENDING }
  /sessions/{id}/msel:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: listMselPending
      description: >-
        白軍待命注入清單（WP-B2c）。回**尚未觸發也未被跳過**的 MSEL 事件 id。
        限白軍/統裁——這是整場演習的腳本，不是任何一方看得到的東西。
      responses:
        "200":
          description: Pending MSEL entries
          content:
            application/json:
              schema:
                type: object
                required: [pending]
                properties:
                  pending: { type: array, items: { type: string } }
        "403": { description: 非白軍/統裁 }
  /sessions/{id}/msel/{entry_id}/fire:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { name: entry_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: fireMselEntry
      description: >-
        白軍扣板機（WP-B2c）。`manual` 型觸發條件唯一會成立的方式。
        命令排入佇列由 runner 於下一 tick 套用——**API 行程不能直接改 runtime 的記憶**
        （不同行程，且熱狀態有 in-process mirror）。
      responses:
        "202":
          description: 已排入（下一 tick 生效）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuedAck" }
        "403": { description: 非白軍/統裁 }
  /sessions/{id}/msel/{entry_id}/skip:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { name: entry_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: skipMselEntry
      description: >-
        白軍決定不發這個狀況（WP-B2c）。**記著而不是刪掉**——AAR 要看得出「原定 vs 實際」。
      responses:
        "202":
          description: 已排入（下一 tick 生效）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueuedAck" }
        "403": { description: 非白軍/統裁 }
  /sessions/{id}/fire-plans:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: listFirePlans
      description: >-
        本陣營的火力計畫（WP-C10.3）。**火力計畫是陣營私有情報**——過濾一律在後端做
        （全知角色可見全部）。
      responses:
        "200":
          description: Fire plans
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FirePlanView" } }
    post:
      operationId: createFirePlan
      description: 建立火力計畫（含預劃目標）。計畫歸建立者的陣營。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateFirePlanRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirePlanView" }
  /sessions/{id}/fire-plans/{plan_id}:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { name: plan_id, in: path, required: true, schema: { type: string } }
    delete:
      operationId: deleteFirePlan
      description: 刪除火力計畫（連同其預劃目標）。已執行的目標留在帳本上，刪計畫不會抹掉那些事實。
      responses:
        "204": { description: Deleted }
        "403": { description: 非本陣營的計畫 }
  /sessions/{id}/fire-plans/{plan_id}/targets/{target_id}/fire:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { name: plan_id, in: path, required: true, schema: { type: string } }
      - { name: target_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: fireFirePlanTarget
      description: >-
        對預劃目標下火力任務（on-call；WP-C10.3）。**本端點不繞過任何閘門**——它組出
        FIRE_MISSION 令後照樣走 `OrderService.submit`（驗證 → 物理預檢 → 火協 gate）。
        故本局若要求火協，此目標仍須自帶已核准的 FIRE_SUPPORT 申請單。
      responses:
        "200":
          description: 已下令（回更新後的目標；order_id 指向產生的令）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FirePlanTargetView" }
        "403": { description: 非本陣營的計畫 }
        "409": { description: 該目標已執行過（一個預劃目標只打一次） }
        "422": { description: 物理預檢不可行（射程/無曲射武器/火協未核准…） }
  /sessions/{id}/aar/replay/states:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getAarReplayStates
      description: >-
        AAR 地圖重播的狀態流（WP-D6.1）。回傳**靜態底本 + 逐 tick 差異**，
        讓前端一次取得整場、拖動時間軸時本地重算，不必每格回後端。
        存取控制與其他 AAR 端點相同（結束的推演、參與者或全知）。
      responses:
        "200":
          description: Replay states
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AarReplayStates" }
        "403": { description: Forbidden }
        "404": { description: Session not found }
  /system/config/test-llm:
    post:
      operationId: testLlmConnection
      security: [{ bearerAuth: [] }]
      description: >-
        測試 LLM 後端連線（如 Ollama：`POST {base}/v1/chat/completions`）。
        **不寫任何設定**——只回連得上與否，讓管理者在存檔前先確認。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestLlmRequest" }
      responses:
        "200":
          description: 測試結果（連不上也是 200——那是測試結果，不是本 API 出錯）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestLlmResult" }
        "403": { description: 僅管理者 }
  /sessions/{id}/autonomy:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getAutonomy
      security: [{ bearerAuth: [] }]
      description: 本局的 AI 自主指派設定（限統裁/白軍/管理）。未設定＝空 `factions`。
      responses:
        "200":
          description: Autonomy config
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomyConfig" }
        "403": { description: 僅統裁/白軍/管理 }
    put:
      operationId: setAutonomy
      security: [{ bearerAuth: [] }]
      description: >-
        設定 AI 自主指派。**回應是存進去之後的那份設定**（經正規化），形狀與 GET 相同——
        曾經 PUT 回 `factions` 的鍵陣列而 GET 回物件，同一欄位兩種型別。
        設定後 runner 會被要求重啟以立即讀取（數秒內生效；熱狀態於 Redis 不中斷）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutonomyConfig" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomySaved" }
        "403": { description: 僅統裁/白軍/管理 }
    delete:
      operationId: clearAutonomy
      security: [{ bearerAuth: [] }]
      description: 清除自主指派並停掉 AI worker（同時清除 AI 狀態遙測——無 AI 即無狀態）。
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutonomyCleared" }
        "403": { description: 僅統裁/白軍/管理 }
  /sessions/{id}/orbat-permissions:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getOrbatPermissions
      security: [{ bearerAuth: [] }]
      description: 本局開放「自編編裝」的陣營清單。空＝只有白軍能編。
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrbatPermissions" }
    put:
      operationId: setOrbatPermissions
      security: [{ bearerAuth: [] }]
      description: 設定開放自編的陣營（限白軍/統裁）。陣營代號逐一驗證，非法即 422。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrbatPermissions" }
      responses:
        "200":
          description: Permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrbatPermissions" }
        "403": { description: 僅白軍可設定 }
  /sessions/{id}/units/{unit_id}/reposition:
    parameters:
      - { $ref: "#/components/parameters/SessionId" }
      - { name: unit_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: repositionUnit
      security: [{ bearerAuth: [] }]
      description: >-
        白軍地圖狀態編輯：直接把單位搬到指定座標。**不落帳**——
        它不是推演中發生的事，是統裁在調整佈署。位置同時寫 DB 與命令通道
        （熱狀態的唯一寫入者是 kernel，API 行程不能直接改）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RepositionRequest" }
      responses:
        "200":
          description: 搬移後的單位
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnitView" }
        "403": { description: 僅白軍/統裁可搬移 }
  /sessions/{id}/aar/missions:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getMissionTimelines
      security: [{ bearerAuth: [] }]
      description: >-
        任務時間軸（WP-A2）——每道任務走過哪些階段、各花了多久。
        **從帳本重建**而不是查任務當前狀態：當前狀態只回答「現在到哪一階段」，
        而 AAR 要回答「它怎麼走到這裡的」；何況已結束的局根本沒有當前狀態可查
        （記憶活在 runner 行程）。存取控制與迷霧投影與其他 AAR 端點相同。
      responses:
        "200":
          description: Mission timelines
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MissionTimeline" } }
        "403": { description: Forbidden }
  /sessions/{id}/aar/stats:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: getAarStats
      description: >-
        AAR 統計指標（§14.2）。**分子/分母的口徑見 `AarStats.stats_version`**——
        WP-D6.2 改過一次語意，跨版本的數字不可直接相比。
        存取控制與其他 AAR 端點相同；非全知觀測者取到的是**經迷霧投影後**的事件流，
        故其戰損數字本來就會比全知少（面射擊的逐單位戰損會被剝掉）。
      responses:
        "200":
          description: AAR metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AarStats" }
        "403": { description: Forbidden }
        "404": { description: Session not found }
  /scenarios:
    get:
      operationId: listScenarios
      security: [{ bearerAuth: [] }]
      description: 已存想定清單（限統裁/管理）。供編輯器「載入既有想定」與 lobby 開局選單。
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ScenarioSaved" } }
        "403": { description: Not an exercise director }
    post:
      operationId: uploadScenario
      security: [{ bearerAuth: [] }]
      description: |
        存一份想定包（存前全量驗證，錯誤帶精確路徑）。限統裁/管理。

        **請求體的鍵集必須與載入器讀的一致**——`roe` 與 `overrides` 曾經不在宣告裡，
        於是走 HTTP 存進來的想定，交戰規則與機動覆寫會靜默消失且無錯誤訊息。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScenarioBundle" }
      responses:
        "200":
          description: Validated & stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenarioSaved" }
        "403": { description: Not an exercise director, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "422": { description: Scenario invalid (precise path in message), content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /scenarios/{sid}:
    parameters: [{ $ref: "#/components/parameters/ScenarioId" }]
    get:
      operationId: getScenario
      description: "回傳已存想定 bundle（供編輯器載入）；限統裁/管理"
      responses:
        "200":
          description: Scenario bundle
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { description: Not found }
    delete:
      operationId: deleteScenario
      description: "刪除想定；限統裁/管理"
      responses: { "204": { description: Deleted } }
