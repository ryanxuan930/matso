      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ControlRequest" }
      responses:
        "201":
          description: Control event emitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlResponse" }
        "403": { description: Not White Cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: ROLLBACK 目標 tick 無對應快照, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/checkpoints:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: listCheckpoints
      security: [{ bearerAuth: [] }]
      description: 可回滾的狀態快照點（WP-E1）。限統裁——快照點洩漏對手的推演節奏。
      responses:
        "200":
          description: Checkpoints（依 ledger_seq 由新到舊）
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CheckpointView" } }
        "403": { description: Not White Cell, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /sessions/{id}/orders:
    parameters: [{ $ref: "#/components/parameters/SessionId" }]
    get:
      operationId: listOrders
      security: [{ bearerAuth: [] }]
      description: 列出 session 指令（pending + 歷史，faction-scoped）
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OrderResponse" } }
        "403": { description: Not a participant, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    post:
      operationId: issueOrder
      security: [{ bearerAuth: [] }]
      description: 驗證 + 物理預檢；通過 → 201 VALIDATED，不可行 → 422（order 落庫為 REJECTED）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
      responses:
        "201":
          description: Order validated & queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderResponse" }
