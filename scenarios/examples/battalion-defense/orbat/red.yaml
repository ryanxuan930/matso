# 紅軍戰鬥序列——裝甲營，自桃園台地西側對大漢溪線實施突穿。SPEC_FULL §11.1。
# 兩軸線同時施壓（主攻大溪橋、助攻石門大壩）是刻意的：目的在逼藍軍過早投入預備隊。
# 兵力與藍軍大致對稱（13 vs 14 個單位），但質的差異在裝甲——紅軍有 MBT，藍軍只有戰鬥車，
# 所以藍軍的反裝甲飛彈分配是勝負關鍵，而非單純的數量比。
faction: RED
units:
  - designation: R-BN-HQ
    unit_level: BATTALION
    lat: 24.8660
    lng: 121.1750
    fixed: true
    equipment:
      - { template: RIFLE_556, quantity: 40, ammo: 210 }

  # === 第一戰車連：主攻（大溪橋軸線），三個戰車排 ===
