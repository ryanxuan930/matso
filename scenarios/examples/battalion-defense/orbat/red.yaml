    parent: R-1CO
    equipment:
      # 車體與主砲分開列：MBT 提供機動/防護（base_stats.mobility），主砲才是開火的武器。
      # 一個戰車排 4 輛是本場的建制標準，兩者數量必須一致，否則會出現「有砲沒車」。
