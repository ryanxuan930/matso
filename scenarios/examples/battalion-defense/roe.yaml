# 交戰規則（SPEC_FULL §11.1／§10 G4；contracts/roe.schema.json 驗證）——營級防禦想定。
# 保護目標清單（No-Strike）**不在此檔**：見 scenario.yaml 的 no_strike_zones。
# 本檔只管「怎麼打」，不管「不准打哪裡」——兩份資料放兩處會產生兩個權威。
version: "1.0"
# 攻守雙方的火力政策刻意不同——這是本想定要示範的核心：規則本身就是一種兵力。
default_fire_policy:
  # 守方 ANTI_ARMOR_HOLD：反裝甲武器只對有效目標（裝甲）開火。
  # 藍軍全營只有 12 具 ATGM、每具 4 發，若讓它們見人就打，紅軍主攻連衝到近戰時就沒彈了。
  # 這條規則把「彈藥分配」從演訓者的紀律問題變成引擎強制的約束。
  BLUE: ANTI_ARMOR_HOLD
  # 攻方 FREE：突穿講求速度，火力不做保留——代價是彈藥消耗快，且誤入禁射區的風險由紅軍自負。
  RED: FREE
weapon_restrictions:
  # 全陣營適用（省略 faction ＝ 所有陣營）。這也是雙方編裝都沒有 MLRS_227 的原因——
  # 規則與編裝要互相說得通，否則演訓者會問「那為什麼給我一個不准用的東西」。
  - forbid_templates: [MLRS_227]
    reason: 大漢溪河谷聚落稠密且石門水庫集水區在內，多管火箭的彈著散布無法確保避開受保護目標，本場統裁全面禁用
