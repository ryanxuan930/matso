# 官方想定 #1：教學用小型（一個排級遭遇戰）。SPEC_FULL §11.1 / §12.1。
name: Tutorial — Platoon Meeting Engagement
version: "1.0"
description: 藍紅兩排於隘口遭遇，供教學與 loader 驗收。
bbox: [120.9, 23.6, 121.4, 23.9]
mode: REALTIME
tick_rate_ms: 60000  # 1 tick ＝ 1 分模擬時間。**這個值從此真的會生效**（過去只進得了匯出檔）；
                     # 原本寫的 1000（＝1 秒/tick）是 schema 預設值被原封帶過來的，以那個節奏
                     # 一個排一 tick 只走 1.4 公尺，每日消耗要 86400 個 tick 才算一天。
hex_resolution: 8
aggregate_adjudication_level: BATTALION
factions:
  - { id: BLUE, display_name: 藍軍, color: "#3b7dd8" }
  - { id: RED, display_name: 紅軍, color: "#d83b3b" }
relations:
  - [BLUE, RED, HOSTILE]
# ⚠ condition DSL 的 type 必須是 triggers.evaluate_condition 支援者
# （time / faction_eliminated / strength_below / unit_in_region / all / any）。
# WP-B6 前這裡寫的是 `eliminate`（不存在的 type）——想定照樣載入，直到執行期評估勝負
# 才丟 TriggerError，等於整局都不會判勝負。載入器現在會在載入時擋下這種寫法。
victory_conditions:
  - faction: BLUE
    condition: { type: faction_eliminated, faction: RED }
  - faction: RED
    condition: { type: faction_eliminated, faction: BLUE }
# WP-A3 禁射區示範：想定作者宣告的保護區。護欄 G4 與人類 precheck 共用同一份判定。
# NO_STRIKE＝硬阻擋（AI 令被剔除、人類令被拒）；RESTRICTED_FIRE＝需白軍/下令者明確確認。
# geometry 一律 GeoJSON 的 [lng, lat] 順序。
no_strike_zones:
  - name: 隘口村落衛生所
    zone_class: NO_STRIKE
    geometry: { type: circle, center: [121.15, 23.75], radius_m: 600 }
  - name: 山區文化資產
    zone_class: RESTRICTED_FIRE
    geometry:
      type: polygon
      ring: [[121.20, 23.78], [121.24, 23.78], [121.24, 23.82], [121.20, 23.82]]
files:
  orbat:
    BLUE: orbat/blue.yaml
    RED: orbat/red.yaml
  msel: msel.yaml
  roe: roe.yaml
  overrides_dir: overrides
