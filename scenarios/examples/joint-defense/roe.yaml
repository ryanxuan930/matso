# 交戰規則（SPEC_FULL §11.1／§10 G4；contracts/roe.schema.json 驗證）——聯合防衛想定。
#
# 保護目標清單（No-Strike）**不在此檔**：它住 scenario.yaml 的 no_strike_zones，
# 因為白軍可在局中以 COP 地圖編輯器增修保護區、且該宣告隨局持久化——同一份資料放兩處
# 就會有兩個權威。本檔只負責 §10 G4 的另一半：對「怎麼打」的規則約束。
#
# 本想定的設計主張：**三方的交戰授權必須不同**。若三方規則一樣，那就只是三支同色部隊，
# 聯盟作戰最真實的摩擦（盟邦能做什麼、不能做什麼、什麼時候鬆綁）就完全演不出來。
version: "1.0"

# 未於令面指定 fire_policy 的 ENGAGE 令所採用的政策。未列的陣營維持引擎預設 FREE。
default_fire_policy:
  # 守土方，在自己國土上作戰，火力運用不設額外預設限制。
  BLUE: FREE
  # 盟邦：反裝甲武器僅對有效目標開火。理由不只是節約彈藥——盟邦每一次開火都要向母國解釋，
  # 拿 ATGM 打步兵在政治上是說不過去的。這條讓 GREEN 打起來就是跟 BLUE 不一樣。
  GREEN: ANTI_ARMOR_HOLD
  # 攻方，登陸作戰求速決，不設預設限制。
  RED: FREE

weapon_restrictions:
  # ── 條文一：盟邦不得使用多管火箭
  # G-MLRS 連確實在 ORBAT 裡（orbat/green.yaml），所以這條是**會咬人的**限制，不是空條款。
  # MLRS_227 射程 70 km、致命半徑 120 m、CEP 200 m——從左營發射，散布圈輕易涵蓋
  # 台南／高雄的稠密市區。盟邦母國的派兵授權只及於「協防與反登陸直接支援」，
  # 未涵蓋此等級的附帶損害風險，故整場禁用。
  # 鬆綁與否由白軍裁決，時機見 msel.yaml 的 `green-roe-review`。
  - faction: GREEN
    forbid_templates: [MLRS_227]
    reason: >-
      盟邦母國派兵授權僅及於協防與反登陸直接支援，未涵蓋長程面殺傷武器；MLRS_227
      致命半徑 120 m、CEP 200 m，自左營陣地射擊之散布圈涵蓋台南／高雄稠密市區，
      附帶損害風險超出授權範圍。解禁須經白軍依 MSEL green-roe-review 裁決。

  # ── 條文二：紅軍火箭砲兵營屬戰役級管制資產
  # 同樣會咬人：R-ART-A 就是一個 MLRS_227 連。長程火力在紅軍體制內屬戰役（軍團）級資產，
  # 射擊須上級核准——這不是道德限制而是指揮體制限制，兩者在 AAR 裡要分得清楚。
  # 解禁時機見 msel.yaml 的 `red-fires-release`（推進受阻且已過 90 分鐘）。
  - faction: RED
    forbid_templates: [MLRS_227]
    reason: >-
      火箭砲兵營為戰役（軍團）級管制資產，射擊須經上級核准；登陸初期通信與目標情報未穩，
      上級未授權旅級指揮所自行運用。此為指揮體制限制而非人道限制，解禁時機見 MSEL
      red-fires-release。
